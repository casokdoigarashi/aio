# =============================================================
# AIO 定点観測 設定ファイル
# ブランド情報・観測クエリ・競合をここで一元管理する
# =============================================================

brand:
  name: "ARIGATO Living"
  # AI回答の中で「自社言及」と判定する表記ゆれ
  aliases:
    - "ARIGATO Living"
    - "ARIGATO LIVING"
    - "アリガトリビング"
    - "アリガト リビング"
    - "アリガト・リビング"
  # 自社ドメイン（引用元に出たら「自社サイト引用」）
  own_domains:
    - "a-ms2.com"
  # 自社が情報を発信・掲載しているメディア（引用元に出たら「関連メディア引用」）
  # note 開設・Yahoo! PR 出稿後にドメインを追記していく
  related_domains:
    - "shootest.jp"
    - "hau-sta.com"
    - "studio-press.com"
    - "whitepanda.jp"
    - "rstudio.co.jp"
    - "studiomall.jp"
    - "spacee.jp"
    - "note.com"          # 2026-07-30 note開設・記事公開により有効化
    # - "news.yahoo.co.jp" # Yahoo!ニュース掲載後に有効化

# 競合（AI回答に登場したら記録する）
competitors:
  - name: "神楽坂スタジオ"
    domains: ["kagurazakastudio.com"]
  - name: "アン・デオール神楽坂"
    aliases: ["アンデオール神楽坂"]
  - name: "坂ノ上スタジオ"
  - name: "shucof神楽坂"
    aliases: ["shucof", "シュコフ"]
    domains: ["studio.powerpage.jp"]
  - name: "神楽坂オンラインスタジオ"
    domains: ["kagurazakaonlinestudio.com"]
  - name: "神楽坂セッションハウス"
    domains: ["session-house.net"]

# 定点観測クエリ
# id は変えない（週次の時系列比較のキーになる）
# 質問ごとの text_by_engine は、そのエンジンだけ別の言い方で聞くための指定。
# 質問IDと text は変えないので、時系列の比較は切れない。
#
# なぜ必要か（2026-11-24、24週分の実測から）:
#   ChatGPTは短いキーワードだと候補を挙げず、「用途・予算・日程を
#   教えてください」と聞き返して終わる。「神楽坂 スタジオ」は19回中19回、
#   「ハウススタジオ 北欧家具 撮影」も19回中19回が聞き返しで、
#   2年近く一度も候補を出していない。文章で聞いた2問は19回中0回。
#   指名の「ARIGATO Living」も9回に1回は英語で聞き返していた。
#   そのため、キーワード形式の質問にChatGPT用の文章を足した。
#
#   Google AI Modeは聞き方を変えても効果がない。文章で聞いた質問の方が
#   マップ由来の回答が多かった（57%／キーワードは42〜51%）。
#   地名を含む質問はローカル検索として扱われるため、記事ではなく
#   Googleビジネスプロフィールの勝負になる。だから聞き方は変えていない。
#
# 対照として、聞き返しがほぼ無かった2問（東京 ハウススタジオ 自然光 /
# インタビュー撮影 スタジオ 都内）はキーワードのまま残している。
# 変更した19問だけが改善したなら、原因は聞き方だと確認できる。

queries:
  - id: q1
    text: "神楽坂 ハウススタジオ"
    text_by_engine:
      chatgpt: "神楽坂でハウススタジオを探しています。おすすめを教えてください。"
    intent: "エリア×業態（最重要ターゲットクエリ）"
  - id: q2
    text: "神楽坂 撮影スタジオ"
    text_by_engine:
      chatgpt: "神楽坂にある撮影スタジオでおすすめはどこですか？"
    intent: "エリア×広義業態"
  - id: q3
    text: "神楽坂 スタジオ"
    text_by_engine:
      chatgpt: "神楽坂で撮影に使えるスタジオを教えてください。"
    intent: "広義（音楽・ダンス等も混在するクエリ）"
  - id: q4
    text: "東京 ハウススタジオ 自然光"
    intent: "特徴軸（自然光）"
  - id: q5
    text: "ハウススタジオ 北欧家具 撮影"
    text_by_engine:
      chatgpt: "北欧家具のあるハウススタジオで撮影したいです。おすすめはどこですか？"
    intent: "特徴軸（北欧家具・デザイナーズ）"
  - id: q6
    text: "ARIGATO Living"
    text_by_engine:
      chatgpt: "ARIGATO Livingとはどんな場所ですか？"
    intent: "指名検索（AIがブランドを正確に説明できるか）"
  - id: q7
    text: "神楽坂でおすすめの撮影スタジオを教えてください"
    intent: "対話型AI向けの自然文クエリ"
  # --- 2026-10-27 追加: 取材・対談テーマのnote発信の効果を測るクエリ ---
  # 既存クエリは時系列が切れるため変更・削除しない（追加のみ）
  - id: q8
    text: "対談 撮影 スタジオ 東京"
    text_by_engine:
      chatgpt: "東京で対談の撮影ができるスタジオを教えてください。"
    intent: "用途軸（対談・取材）※noteの取材記事の効果測定用"
  - id: q9
    text: "インタビュー撮影 スタジオ 都内"
    intent: "用途軸（インタビュー）※同上"
  - id: q10
    text: "取材や対談の撮影ができる都内のスタジオを教えてください"
    intent: "用途軸の自然文クエリ ※同上"

  # --- 2026-11-19 追加: 観測範囲の拡張（10問 → 30問） ---
  # エリア
  - id: q11
    text: "飯田橋 撮影スタジオ"
    text_by_engine:
      chatgpt: "飯田橋の近くで撮影スタジオを探しています。おすすめはどこですか？"
    intent: "エリア軸（隣接エリア。神楽坂より検索母数が大きい）"
  - id: q12
    text: "新宿区 ハウススタジオ"
    text_by_engine:
      chatgpt: "新宿区にあるハウススタジオを教えてください。"
    intent: "エリア軸（行政区名での探し方）"
  # 特徴
  - id: q13
    text: "2面採光 撮影スタジオ 東京"
    text_by_engine:
      chatgpt: "2面採光で光がよく入る撮影スタジオを東京で探しています。"
    intent: "特徴軸（東面・南面の2面窓）"
  - id: q14
    text: "無垢材 床 撮影スタジオ 東京"
    text_by_engine:
      chatgpt: "床が無垢材の撮影スタジオを東京で教えてください。"
    intent: "特徴軸（無垢材の床）"
  - id: q15
    text: "キッチン付き 撮影スタジオ 東京"
    text_by_engine:
      chatgpt: "キッチン付きの撮影スタジオを東京で探しています。おすすめはどこですか？"
    intent: "特徴軸（カウンターキッチン／IH）"
  - id: q16
    text: "天井高 撮影スタジオ 都内"
    text_by_engine:
      chatgpt: "天井が高い撮影スタジオを都内で教えてください。"
    intent: "特徴軸（天井高 最大2,680mm）"
  # 用途
  - id: q17
    text: "商品撮影 スタジオ 東京 自然光"
    text_by_engine:
      chatgpt: "自然光で商品撮影ができるスタジオを東京で教えてください。"
    intent: "用途軸（物撮り）"
  - id: q18
    text: "レシピ撮影 スタジオ 都内"
    text_by_engine:
      chatgpt: "レシピ撮影ができるスタジオを都内で教えてください。"
    intent: "用途軸（レシピ・food）"
  - id: q19
    text: "YouTube 撮影 スタジオ 東京"
    text_by_engine:
      chatgpt: "YouTubeの撮影ができるスタジオを東京で教えてください。"
    intent: "用途軸（動画。配信機材が無料）"
  - id: q20
    text: "動画配信 スタジオ 新宿区"
    text_by_engine:
      chatgpt: "動画配信ができるスタジオを新宿区で教えてください。"
    intent: "用途軸（配信）"
  - id: q21
    text: "セミナー 会場 神楽坂"
    text_by_engine:
      chatgpt: "神楽坂でセミナーができる会場を教えてください。"
    intent: "用途軸（撮影以外。日額料金あり）"
  - id: q22
    text: "展示会 スペース 新宿区"
    text_by_engine:
      chatgpt: "新宿区で展示会ができるスペースを教えてください。"
    intent: "用途軸（撮影以外）"
  # 自然文・対話型
  - id: q23
    text: "神楽坂で自然光の入る撮影スタジオはありますか？"
    intent: "自然文（エリア×特徴）"
  - id: q24
    text: "北欧家具のあるハウススタジオを教えてください"
    intent: "自然文（特徴）"
  - id: q25
    text: "東京で対談撮影ができる、会議室っぽくないスタジオはどこですか？"
    intent: "自然文（用途×否定条件）"
  - id: q26
    text: "キッチンのある撮影スタジオを東京で探しています。おすすめはどこですか？"
    intent: "自然文（設備）"
  - id: q27
    text: "撮影機材を無料で貸してくれるスタジオは東京にありますか？"
    intent: "自然文（備品無料）"
  # 比較・選び方
  - id: q28
    text: "ハウススタジオと撮影スタジオの違いを教えてください。神楽坂で選ぶなら？"
    intent: "比較・選び方（AIが一覧形式で答えやすい）"
  - id: q29
    text: "都内のハウススタジオを比較したいです。自然光重視ならどこがおすすめですか？"
    intent: "比較・選び方"
  # 指名（順位ではなく、AIが事実を正しく言えているかの検査）
  - id: q30
    text: "ARIGATO Living 神楽坂 料金"
    text_by_engine:
      chatgpt: "神楽坂のARIGATO Livingの利用料金を教えてください。"
    intent: "指名×事実検査。誤った料金を答えていないか回答本文を確認する"

# 観測エンジン
# ここに書いたエンジンを scripts/auto_check.py が実行する
# （対応する環境変数が設定されているものだけ動く。すべてAPI取得＝スクショ不要）
engines:
  auto:
    - google_ai_mode  # SERPAPI_KEY（Google AIモードの回答本文＋引用元）
    - gemini          # GEMINI_API_KEY（Google検索グラウンディング）
    - claude          # ANTHROPIC_API_KEY（Claude + web search）
    - chatgpt         # OPENAI_API_KEY（ChatGPT + web search）
    # - perplexity      # PERPLEXITY_API_KEY
    # - serpapi_google  # SERPAPI_KEY（AI Overview + オーガニック順位。別課金になるので任意）

# note（1次情報の発信元）
# 公開記事の日付を自動取得し、AI検索の変化と突き合わせる
note:
  username: casokdo_note

# 各エンジンで使うモデル（未指定なら下記の既定値）
# モデルは変えないこと。同じ質問に同じモデルで答えさせるのが定点観測の前提で、
# 変えると測っている対象そのものが変わる。
models:
  claude: claude-opus-5
  chatgpt: gpt-5

# 1週あたり同じ質問を何回聞くか（エンジンごと）
#
# AIの回答は毎回変わるため、複数回聞いて「n回中何回出たか」で記録する。
# Claude だけ 1 にしているのは費用のため:
#   Claude は web search で1クエリあたり13〜19件の情報源を読んでおり、
#   その本文が入力トークンになる。Opus の単価（入力$5/出力$25 per 1Mトークン）と
#   合わせて1回 $0.15〜0.30 かかり、他エンジンの6〜9倍になる。
#   2026-07 からの時系列も n=1 なので、1 のままのほうが過去と比較できる。
trials:
  default: 3
  claude: 1
  google_ai_mode: 1   # SerpApiの無料枠（月250検索）を使い切らないため

# 会社ID（多社展開時にデータを分けるキー）
client_id: arigato_living

# 観測結果の書き込み先スプレッドシート
# 認証は GitHub Secrets の GOOGLE_SERVICE_ACCOUNT_JSON（サービスアカウントの鍵）
# 初回設定の手順は docs/SHEETS_SETUP.md
sheets:
  spreadsheet_id: "1A76_uywRdOCL9TQ-yX66LbwKK61p3QXzSK_vA9ZJ4LU"
