name: note下書き作成

# 実行方法は2通り
#  1. Actions画面から手動実行（Run workflow）で原稿ファイルを指定する
#  2. .github/run-note-draft を書き換えてpushする
#     （1行目に原稿のパス、2行目に dry_run と書くと変換確認だけ）
on:
  workflow_dispatch:
    inputs:
      file:
        description: "原稿ファイル（例: content/note/2026-10-28_取材対談スタジオ.md）"
        required: true
        type: string
      dry_run:
        description: "変換結果の確認だけ（noteにログインしない）"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - claude/aio-search-impact-tracking-auwbao
    paths:
      - ".github/run-note-draft"

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        id: target
        env:
          INPUT_FILE: ${{ inputs.file }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          if [ -n "$INPUT_FILE" ]; then
            file="$INPUT_FILE"
            dry=""
            [ "$INPUT_DRY" = "true" ] && dry="1"
          else
            # コメント行と空行を除いた最初の行を原稿パスとして読む
            mapfile -t lines < <(grep -v '^\s*#' .github/run-note-draft | grep -v '^\s*$')
            file="${lines[0]}"
            dry=""
            printf '%s\n' "${lines[@]:1}" | grep -q 'dry_run' && dry="1"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "原稿: $file / dry_run: ${dry:-no}"

      # どの名前で登録されているか確認する。値は出さず、設定の有無と文字数だけ。
      - name: Diagnose credentials
        env:
          V_NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          V_NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          V_NOTE_PASS: ${{ secrets.NOTE_PASS }}
          V_NOTE_PASSWARD: ${{ secrets.NOTE_PASSWARD }}
          V_NOTE_PW: ${{ secrets.NOTE_PW }}
          V_NOTE_ID: ${{ secrets.NOTE_ID }}
          V_NOTE_COOKIES_JSON: ${{ secrets.NOTE_COOKIES_JSON }}
        run: |
          for name in NOTE_EMAIL NOTE_PASSWORD NOTE_PASS NOTE_PASSWARD NOTE_PW NOTE_ID NOTE_COOKIES_JSON; do
            value="$(printenv "V_$name" || true)"
            if [ -n "$value" ]; then
              echo "設定あり: $name（${#value}文字）"
            else
              echo "未設定  : $name"
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Create note draft
        env:
          # 下のどちらか一方を Secrets に登録しておけば動く
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_COOKIES_JSON: ${{ secrets.NOTE_COOKIES_JSON }}
          NOTE_DRY_RUN: ${{ steps.target.outputs.dry }}
          NOTE_SHOT_DIR: ${{ runner.temp }}/note_shots
        run: node scripts/note_draft.js "${{ steps.target.outputs.file }}"

      - name: Upload confirmation screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-draft-screenshot
          path: ${{ runner.temp }}/note_shots
          if-no-files-found: ignore
