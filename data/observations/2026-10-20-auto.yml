    \n---\n\n### 1. テイスト別・人気の自然光ハウススタジオ\n\n#### ① 白基調・シンプル・モダン（アパレルEC／ポートレート／物撮り）\n* **Studio 5th NAKAMEGURO（中目黒）**\n\
