    - Beige/R STUDiO（目黒・西小山）: 目黒線「西小山」徒歩3分。自然素材×曲線のミニマル空間でやわらかな自然光。基本9:00–19:00、時間外も応相談。 ([beige-r.com](https://beige-r.com/?utm_source=openai))

