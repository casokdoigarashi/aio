    。\n\n**レンタルスペース８神楽坂**\n神楽坂駅から徒歩1分、レトロで多目的な完全個室スペース。自然光が降り注ぐ白壁の空間で光WiFi完備、撮影スタジオ・動画配信・会議・女子会にも最適。1〜8名向けで1時間¥1,320〜\n\
