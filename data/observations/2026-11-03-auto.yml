  answer_text: "都内でインタビュー撮影向きのスタジオですね。いくつか候補を先に挙げます。要件に合わせて絞り込み・見積りもできますので、以下を教えてください。\n- 同時録音の有無（防音必須か）／人数（出演者・スタッフ）／希望背景（白・黒・グリーンバック・セット風）\n\
    - エリア（例：渋谷・新宿・千代田・港区など）／希望日時／ご予算／機材の持込 or レンタル\n\n防音・同録に強い／アクセス良好の候補\n- ワンストップスタジオ東京（千代田区・神田3分）\n\
    \  防音＋吸音で同録可。白ホリ／4面グリーン完備、メイク・控室・専用駐車場あり。住所：千代田区神田東松下町38。インタビューや対談用途の記載あり。 ([1stop-studio.tokyo](https://www.1stop-studio.tokyo/service/video-shooting/))\n\
    - LIMANI K3 STUDIO（港区・芝浦）\n  田町／三田／芝浦ふ頭エリア。館内に完全防音スタジオと白ホリ／グリーン対応の中型防音スタジオが明記。住所：港区海岸3-5-1。専用駐車場あり。\
    \ ([limani.studio](https://www.limani.studio/docs/LIMANI%E3%83%91%E3%83%B3%E3%83%952023_A4%E4%B8%89%E3%81%A4%E6%8A%98%E3%82%8A_20230807.pdf))\n\
    - 南麻布MIC Studio（港区・麻布十番／白金高輪）\n  防音設計・遮音吸音、グリーンバック有。平日¥11,000/h〜（最低4h）・機材付きプランもあり。面積約42㎡、インタビュー収録向け記載。住所：港区南麻布2-4-5。\
    \ ([publicspace.jp](https://publicspace.jp/spaces/414))\n- アルファビデオ 赤坂スタジオ（港区・赤坂見附）\n  防音スタジオ。ムービー¥11,000/h（最低3h）、白壁／ロール背景／グリーン、1Gbps占有回線、インタビュー・配信想定の設備。住所：港区元赤坂1-5-7。\
    \ ([alphavideo.co.jp](https://www.alphavideo.co.jp/service/studio/))\n- CYK Studios（中野新橋）\n  地下の2面R白ホリ、配信・同録・コントロールルームあり。住所：中野区本町5-13-6。ただし規約に「天井は完全防音ではないため上階の音が聞こえる場合あり」との注記あり（用途により下見推奨）。\
    \ ([cyk.jp](https://cyk.jp/?utm_source=openai))\n- 革新スタジオTOKYO（中央区・日本橋）\n  XR／バーチャル系のトーク・インタビュー向け。カメラ3台・オペ・カメラマン込みで1hあたり実質¥20,000相当のパッケージ（例：2時間¥115,000など）。少人数対談に最適と明記。\
    \ ([studioku.tokyo](https://www.studioku.tokyo/kakushin))\n\n注意点（予約前に要確認）\n- 多くの白ホリ系は「同録可でも完全防音ではない」ケースがあるため、同録予定なら必ずロケハンとテスト録音を。例：大手格安スタジオのFAQでも「同録可だが防音設備なし・環境音あり」と明記。\
    \ ([461.studio](https://461.studio/faq/064509202414022684?utm_source=openai))\n- 最低利用時間・キャンセル規定・夜間早朝割増・電源料金や白ホリ再塗装費の有無を確認。例：赤坂スタジオはムービー最低3h・キャンセル料記載あり／別スタジオでは「同録予定は事前下見を」との注意書きあり。\
    \ ([alphavideo.co.jp](https://www.alphavideo.co.jp/service/studio/))\n\n要件をいただければ、上記から最適3案に絞って空き状況確認テンプレ（問い合わせ文）と概算見積り（スタジオ費＋想定機材＋人件費）をお作りします。"
