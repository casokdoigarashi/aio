    \n東京・関東近郊を中心に、北欧家具の質やテイスト別に代表的なスタジオと選ぶポイントをまとめました。\n\n---\n\n### 1. 本格的な北欧名作・ヴィンテージ家具が揃うスタジオ\nハンス・J・ウェグナーやフィン・ユール、ボーエ・モーエンセンなど、本物の北欧ヴィンテージ家具が常設されているスタジオです。上質で落ち着いたトーンの撮影に向いています。\n\
