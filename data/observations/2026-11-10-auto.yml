    \  * **向いている撮影:** 暮らしのシーン、インタビュー、対談、動画配信。\n* **OLUE STUDIO（日本橋浜町）**\n  * **特徴:** 白壁にやわらかな自然光が入り、ヨーロッパ・北欧のヴィンテージ家具がセンス良く配置された隠れ家スタジオ。\n\
    \  * **向いている撮影:** アパレルLOOKBOOK、物撮り、ウェディング前撮り。\n* **撮影スタジオ HOKUO（新高円寺）**\n  * **特徴:** 「都内で暮らすデザイナーの北欧アパートメント」をコンセプトにした1LDKのハウススタジオ。小規模ながらヴィンテージ感あふれる家具・小物が揃っています。\n\
    \  * **向いている撮影:** 個人撮影、YouTube・SNS用動画、暮らし系の日常シーン。\n\n---\n\n### 2. 白基調×ナチュラル北欧モダンの明るいスタジオ\n明るい自然光、白壁、明るいトーンのウッド（オークやバーチ材）が特徴で、清潔感と温かみのあるスタジオです。\n\
    \n* **STUDIO CANAL（塩浜・清澄白河エリア）**\n  * 水辺のロケーションと木製家具がマッチする大型ハウススタジオ。明るい採光とナチュラルモダンな空間が豊富です。\n* **PASTIS\
