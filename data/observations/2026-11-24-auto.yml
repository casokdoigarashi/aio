    \  * 天井高4m、窓の比率が高く周辺に遮るものがないため日中強い自然光が入るマンションスタジオ。\n\n---\n\n### 2. 自然光スタジオを選ぶ際のチェックポイント\n\n1. **窓の方角と撮影時間帯**\n\
    \   * **東向き**：午前中に直射日光が入る（朝の爽やかな光）。\n   * **南向き**：日中（10:00〜14:00頃）を通して最も安定して明るい。\n   * **西向き**：午後〜夕方にドラマチックな西日（斜光）が入る。\n\
