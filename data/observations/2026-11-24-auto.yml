    \n### 2. キッチンスタジオを選ぶときのチェックポイント\n\n用途によって必要な設備が大きく異なるため、事前に以下の点を確認しておくのがおすすめです。\n\n1. **調理の可否・火気制限**\n\
    \   * 「見立て（消えモノの盛り付けのみ）」専用で、**本格調理（炒め物・油跳ね・強い煙や匂いが出る調理）がNG**なスタジオもあります。\n   * ガスコンロかIHか、火力の強さも確認しておくと安心です。\n\
    2. **キッチンの形状・撮影アングル**\n   * **アイランドキッチン / ペニンシュラキッチン**：正面からの引きの画や手元、対面での会話シーンが撮りやすい。\n   * **壁付けキッチン**：一人暮らし設定などには向いていますが、カメラの配置スペースが限られる場合があります。\n\
    \   * **俯瞰撮影（真上からの手元撮影）**ができる天吊りバーや三脚スペースの有無。\n3. **自然光・採光の向き**\n   * 朝食やカフェ風の爽やかなトーンで撮りたい場合、南向きや東向きの大きな窓があるかが重要です。\n\
    4. **調理器具・食器・消耗品の有無**\n   * 包丁、まな板、鍋・フライパン、盛り付け皿、カトラリーのラインナップ。\n   * サランラップ、キッチンペーパー、洗剤などの消耗品が常備されているか（持参が必要か）。\n\
