    \  * 自然光スタジオの草分け的存在。白壁とナチュラルウッドの床に、朝から夕方まで光が回る設計が特徴です。\n\n#### ② ライフスタイル・生活感・北欧系（日用品・ファミリー・日常シーン）\n\
