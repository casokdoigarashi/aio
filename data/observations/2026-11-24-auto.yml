    \n#### 2. 時間帯や天候に左右されず、一日中均一な光がほしいなら\n* **下北沢 スタジオレナード（下北沢）**\n  * **特徴**: 一軒家タイプのスタジオで、天井が**全面天窓**になっているのが最大の特徴です。\n\
