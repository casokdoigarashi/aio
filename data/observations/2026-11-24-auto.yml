  answer_text: "ご用途や雰囲気の希望がまだ分からないので、まずは都内で実績があり“キッチンでの撮影に強い”ところをタイプ別にピックアップしました。候補を絞るために、最後にいくつか質問も置きます。\n\
    \n- Studio coody（麻布十番一帯・4拠点）\n  - 906キッチン／メインキッチン／ルームキッチン／東麻布レミューの4スタジオが近接。アイランド＋壁付の複数キッチンや控室を備え、24時間利用可の拠点もあり。レミューは高品位キッチン2台で対決企画などに強い。メインは約86㎡でアイランド＋壁付の2面構成。料金は目安で時給1.5万～1.9万円帯。\
