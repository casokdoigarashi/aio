    \n---\n\n### 1. 王道・ナチュラル＆クリーン系（白壁・ウッド・モルタル）\n\n#### **studio Flocke（フロッケ）恵比寿**（渋谷区・恵比寿）\n* **特徴:**\
    \ 駒沢通り沿いの好立地。高さ3mの大型窓が2面に広がり、天井高は最大約4m。白壁とフローリングで構成され、終日柔らかく明るい光が差し込みます。\n* **向いている撮影:** アパレルLOOK、ポートレート、ビューティー系スチール。\n\
    * **最寄駅:** 恵比寿駅 徒歩約2〜4分。\n\n#### **so-so studio MEGURO**（品川区・上大崎）\n* **特徴:** 白モルタル床と白壁をベースにしたシンプルな2面採光スタジオ。余計な装飾が少なく、家具やプロップを活かしたミニマルな撮影が可能です。24時間利用に対応しているのも利点です。\n\
