  answer_text: "都内で「天井高」の撮影スタジオをお探しの場合、撮影用途（大型照明の吊り込み、俯瞰撮影、建て込み、車搬入、MV撮影など）によって必要な高さやスタジオのタイプ（白ホリ／ハウス系／大型スタジオ）が分かれます。\n\
    \n---\n\n### 1. 天井高スタジオの代表例（タイプ別）\n\n#### ① 白ホリゾント（CM・MV・広告スチール向け）\n* **イメージスタジオ109（目黒スタジオ・四谷スタジオ）**\n\
    \  * **天井高：** 約6.0m〜6.7m\n  * **特徴：** CMや大型MVの定番スタジオ。3面R白ホリゾント、キャットウォーク、バトン設備、防音（同録）対応などプロユースの設備が整っています。\n\
    * **TACS ODAIBA STUDIO（江東区・青海）**\n  * **天井高：** 約6.0m\n  * **特徴：** 湾岸エリアの大型スタジオ。車乗り入れ搬入が可能で、大型セットの建て込みやダンス撮影などにも適しています。\n\
    * **中目黒スタジオ（目黒区・中目黒）**\n  * **天井高：** 約5.0m\n  * **特徴：** 都心（中目黒駅から徒歩圏内）にありながら5mの高さを確保したアクセス重視の白ホリ。\n\
    \n#### ② ハウススタジオ・自然光・倉庫系（ファッション・スチール・PV向け）\n* **STUDIO ECOLO / ECOLO GARDEN（大田区・平和島周辺など）**\n  * **天井高：**\
    \ 5.0m〜\n  * **特徴：** 天井高5m以上の広々とした空間に自然光が差し込む人気スタジオ。大型セットの建て込みや開放感のあるシーンが撮影可能。\n* **studio roof（大田区・上池台）**\n\
    \  * **天井高：** 約4.5m〜5.0m超\n  * **特徴：** 300㎡の広さに天窓からの自然光が入るスタジオ。建て込み制作にも対応しており、天井の高さを活かした立体的な撮影が可能です。\n\
    * **新木場・辰巳エリアの倉庫リノベ系スタジオ**\n  * 元倉庫・木材倉庫を改装したスタジオが多く、天井高4m〜6m前後を確保している施設が集中しています（例：Studio Canale、Studio\
    \ Basil周辺など）。\n\n#### ③ 超大型・多目的スペース（特大建て込み・大型イベント配信）\n* **スターライズタワー「Studio Earth」（港区・芝公園）**\n  * **天井高：**\
    \ 7.3m（約150坪）\n  * **特徴：** 東京タワーのすぐ足元にある都内最大級のスタジオ。大規模MV、大型クレーンを使用した撮影、記者発表会・配信に対応しています。\n* **東宝スタジオ\
    \ / 角川大映スタジオ（世田谷区・成城／調布市）**\n  * **天井高：** 8m〜11m以上\n  * **特徴：** 映画・ドラマ用の本格ステージ。街並みの建て込みやワイヤーアクションなどが必要な場合に選ばれます。\n\
    \n---\n\n### 2. 天井高スタジオを探しやすい検索ポータル\n\n特定の高さや設備で絞り込みたい場合、以下の専門ポータルが便利です。\n\n* **[白ホリドットコム](https://shirohori.com/)**\n\
    \  * 「天井高5m以上」「天井高の高い順」でソート可能。白ホリに絞って探すなら最適です。\n* **[SHOOTEST（シューテスト）](https://shootest.jp/)**\n \
    \ * 「天井高5m以上」「天井高3m以上」などの条件タグがあり、ハウススタジオや倉庫系を探すのに向いています。\n* **[R]studio（アールスタジオ）**\n  * 自然光が入る高天井スタジオや、デザイン性の高い空間を多数掲載しています。\n\
    \n---\n\n### 3. 選定時の確認ポイント\n\n1. **有効天井高（梁・バトン下）の確認**\n   * カタログ表記が「天井高6m」でも、照明用バトンや鉄骨の梁の下までは実質4.5m〜5m程度というケースがあります。\n\
    2. **俯瞰（キャットウォーク）の有無**\n   * 真上からのアングル（真俯瞰）を撮りたい場合、脚立ではなくキャットウォークや中2階の撮影デッキがあるか確認が必要です。\n3. **搬入経路と搬入口の高さ**\n\
    \   * 天井が高くても「エレベーターが狭い」「搬入口のシャッター高が2.1mしかない」と、大きな大道具やイントレが搬入できない場合があります。\n4. **同録（音声同時収録）の反響**\n\
    \   * 天井が高く広い空間（特に倉庫系・コンクリート打ちっぱなし）は音が反響しやすいため、インタビューや動画撮影時は「吸音カーテンの有無」や「同録実績」の確認が推奨されます。"
