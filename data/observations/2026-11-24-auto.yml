    ---\n\n### 1. 特徴別・おすすめキッチンスタジオ\n\n#### ① 本格的な料理動画・レシピ撮影・配信向け\n*広めのアイランドキッチンがあり、調理器具や食器類が豊富、撮影導線が広いスタジオです。*\n\
    \n* **Patia（パティア）**（都内複数：市ヶ谷、四谷、神保町、新保町など）\n  * キッチン特化型スペース。アイランドキッチン、最新のオーブンや調理器具・食器が完備されており、料理教室・レシピ動画撮影・配信イベントに最適。\n\
