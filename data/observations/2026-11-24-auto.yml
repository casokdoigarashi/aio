    ## エリア別の具体例\n\n**都心・アクセス重視**\n- **ホワイトマカロン**（四谷三丁目駅徒歩1分）\n白を基調としたスペースに自然光が3方向から入るハウススタジオ、33㎡、3,080円/h〜\n\
    \ — コスパ最優先ならここ\n- **swamp gallery 神楽坂** \n3面採光。可動式壁や扉、厳選家具で演出自在。アパレル・ポートレート・商品撮影から展示会まで対応、16,500円〜/1h\n\
    \n- **サモスタ目黒店501・502** \n目黒駅徒歩2分、南向き窓で自然光撮影可。北欧モダンと無機質コンクリートの2種類\n\n\n**一軒家・庭付き（世田谷方面）**\n- **HUDSON\
    \ STUDIO & GARDEN**（下北沢〜成城学園前）\n200㎡以上の敷地にスタジオ二つとガーデン。アパレル等の自然光撮影やガーデンシーン、CM・MV撮影にも対応、14,300円〜/1h\n\
    \n- **studio mood**（世田谷区砧）\n高く白い壁に囲まれた広い芝生の庭と自然光が心地よいハウススタジオ。一棟貸し\n\n- **トドロキスタジオ**（九品仏駅徒歩10分）\n高台に佇む一軒家ハウススタジオ、72㎡、12,000円/h\n\
    \n\n**ナチュラル／シャビーシック系**\n- **STUDIO Greige**（落合南長崎駅徒歩5分）\nフレンチ家具や小物を基調としたシャビーシックな空間。窓が大きく自然光がたっぷり注ぎ、明るく柔らかな雰囲気。モールディングやレンガ、ウッド製の窓枠が背景のアクセントになり、LED照明やレフ板も充実\n\
    （\n4,400円/1h〜\n）\n- **駒場Studio B**（駒場東大前駅徒歩3分）\n白壁にウッド調の家具・小物、グリーンが揃うナチュラルスタジオ。カウンターキッチン、洗面台、浴室、ベッドルームなど生活風景撮影に、16,500円〜/1h\n\
    \n- **かわせみ亭**（巣鴨）\n古民家平屋の一軒家。自然光が入る開放的な空間。日本庭園やアイランドキッチンも有、5,500円〜/1h\n\n\n## 選定のポイント\n\n1. **窓の方角と採光面数**\
