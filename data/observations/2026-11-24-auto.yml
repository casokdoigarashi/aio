    \ — \n収録・配信に特化し、本棚エリア・白壁・ウッド壁・グリーン壁・3Dバーチャルに対応、クロマキー撮影も可。77,000円〜/4h\n。\n\n## 書斎・ライブラリー調（取材カットに映える）\n\
