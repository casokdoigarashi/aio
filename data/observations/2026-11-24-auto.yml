  answer_text: '目的やテイスト別に、自然光がきれいな「都内のハウススタジオ」を厳選しました。まずは候補を見て、条件（場所/広さ/キッチン有無/庭や屋上/ご予算/撮影日時）を教えてください。撮影時間帯に合わせて最適順に絞り込みます。


    明るい自然光で評判のスタジオ候補

    - Studio TERRANOVA（代々木上原）– 高台にあり、窓から自然光がたっぷり入るキッチン付きのハウススタジオ。LDK〜リビング/ダイニングの生活感あるシーンに強い。([studio-terranova.com](https://www.studio-terranova.com/?utm_source=openai))

    - studio CUBE（目黒・大橋）– 約100㎡。2Fに大きな南向き窓、3Fはペントハウス＆屋上で外光を活かしたカットが撮りやすい。([st-cube.com](https://st-cube.com/?utm_source=openai))

    - MOCA studio Hiroo（広尾）– 145㎡・天高約3.5mの最上階。大開口から朝〜午後にかけてたっぷり自然光が入る、柔らかな雰囲気が得意。([crea.website](https://crea.website/en/locations/cmwjqaqg8001xj9f5lh84v0wc?utm_source=openai))

    - yanké 501（千駄ヶ谷）– 南向き・幅約12mの連窓＋バルコニーで、明るい直射〜拡散光を広く回せる。都会的ミニマル系の絵作りに。([crea.website](https://crea.website/en/locations/cmvk0ehk9002z6bt6xyzqcgxl?utm_source=openai))

    - スタジオピーク 北参道 NATURAL KITCHEN – 北参道駅徒歩1分のハウスフロア。自然光＋可動キッチン/可動壁で料理〜ライフスタイルの多用途に対応。([crea.website](https://crea.website/en/locations/cmvpq1a0q000rnwq1s65k6rda?utm_source=openai))

    - studio mon 自由が丘 – 一軒家＆庭つき。南向き窓でやわらかい自然光、和室や縁側もあってファミリー/生活カットに強い。遮光シャッターでコントロールもしやすい。([studiomon.com](https://studiomon.com/application/files/6916/9870/6655/studiomon_guaid_jiyugaoka_202311.pdf?utm_source=openai))

    - ハドソンスタジオ＆ガーデン（Studio Tokyo）– 1F/2F＋屋外ガーデンで季節の緑と自然光を活かしたシーンが幅広く撮れる大型ハウス。([studio-tokyo.jp](https://www.studio-tokyo.jp/hudsonstudioandgarden?utm_source=openai))

    - STUDIO EARLYBiRD（大田区・千鳥）– 白基調・約213㎡。自然光の回る広い空間でルックを作り込みやすい。([garden-studio.com](https://garden-studio.com/wp-content/uploads/2023/12/EARLYBiRD.pdf?utm_source=openai))


    比較の見方（自然光重視のチェックポイント）

    - 光の向きと時間帯：南向き＝終日安定、東向き＝午前の直射や逆光、⻄向き＝午後のドラマチックな斜光。予約時間に合う向きを選ぶ。各スタジオの方角/時間帯は上記リンク先の図面・紹介文で要確認。([st-cube.com](https://st-cube.com/?utm_source=openai))

    - 抜け/周辺環境：最上階や高台、屋上やバルコニー、庭つきは光が回りやすい。周囲に高い建物が少ないほど安定。([studio-terranova.com](https://www.studio-terranova.com/?utm_source=openai))

    - 生活シーンの作りやすさ：アイランドキッチンや可動キッチン、家具バリエーションの有無を確認。料理/ライフスタイル撮影ならTERRANOVAや北参道NKが便利。([studio-terranova.com](https://www.studio-terranova.com/?utm_source=openai))

    - ロケーションまとめ記事での横断比較：[R]studioの「自然光スタジオ特集」も参考に候補を広げられます。([rstudio.co.jp](https://www.rstudio.co.jp/topic/7097/?utm_source=openai))


    次の情報を教えてください（最適な3〜5件に絞って空き確認先も提案します）

    - 撮影内容と人数（モデル/スタッフ）

    - 希望日時（例：12月◯日 午前／午後）

    - 希望エリア（渋谷〜新宿周辺、城南、城東など）

    - 必要設備（キッチン/バス/庭・屋上/駐車/発電容量など）

    - 予算感（1日 or 4h/8hパック目安）'
