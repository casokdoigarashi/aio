    \n\n## 3. ビジネス色を出したいオフィス系\n\n- **G STUDIO**（中野・荻窪、13,200円〜/1h）\nシンプルモダンなデザイン会社オフィス。会議・ワークシーンやPR撮影に最適で、有線接続可能なため生配信にもおすすめ\n\
    \n- **ホットスケープ本社オフィス**（神谷町、27,500円〜/1h）\n徒歩3分・約220㎡で、会議室や執務室など6つの空間を貸切利用可能。化粧照明や電動スクリーンあり\n\n- **INBOUND\
    \ LEAGUE**（16,500円〜/1h）\nアレンジ次第で対談やインタビューに対応でき、家具を移動すれば白壁撮影も可能\n\n\n## 選定のチェックポイント\n- **配信の有無**：ライブ配信なら有線LAN・音響卓・クロマキー対応を確認（上記streamers/b.studioなど）\n\
