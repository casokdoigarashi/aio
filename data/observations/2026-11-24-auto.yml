    \n* **スタジオフィオーレ（目黒）**\n  * アンティーク調でおしゃれなキッチンと自然光が特徴。同録（音声同時録音）に対応した環境や複数のシチュエーションが揃っており、対談やレシピ動画にも人気です。\n\
    * **パスティス＆バジル（世田谷・目黒など都内多数）**\n  * 南欧風やナチュラルテイストなど、自然光がたっぷり入る定番ハウススタジオグループ。実際に火が使えるキッチンを備えたスタジオが複数あります。\n\
    * **GOBLIN. 系列（代官山・北参道など）**\n  * カフェ風やモダンリビング調など、スタイリッシュな空間が多く、WebCMやインタビュー撮影、タイアップ商品撮影に向いています。\n\n\
    #### ② 料理動画・番組配信に特化した「本格調理向けスタジオ」\n*YouTube、レシピ撮影、料理教室配信など、演者と手元の両方をしっかり映したい場合におすすめです。*\n\n* **レンタルキッチンスペース\
    \ Patia（パティア / 東麻布・四谷・神田など）**\n  * 広々としたアイランドキッチンを備え、正面からの撮影や複数人での作業がしやすい設計。食器や調理器具も豊富に揃っています。\n*\
    \ **麻布十番906キッチンスタジオ（港区）**\n  * フードコーディネーター目線で作られたスタジオ。サブキッチンや控室も充実しており、効率よく料理の下準備・差し替え撮影が可能です。\n*\
    \ **PATOLONE 7studio（新宿・曙橋）**\n  * 都内でも屈指の広さ（200㎡超）を誇り、白ホリゾント併設かつリーズナブル。大人数のクルーが入る大型スチール・ムービー撮影に便利です。\n\
    \n---\n\n### 2. キッチンスタジオを選ぶときのチェックポイント\n\n1. **「実際の調理」が可能か（火気使用ルール）**\n   * スタジオによっては「見栄え用のダミーキッチン」で、**湯沸かし程度しかできない場所**や「ガス不可・IHのみ」の場所があります。油跳ね・煙が出る調理が可能か事前に確認が必要です。\n\
    2. **キッチンのレイアウト（アイランド vs 壁付け）**\n   * 手元や演者の表情を正面から撮りたい場合、あるいはカメラを前後に引きたい場合は**「アイランドキッチン（対面型）」**が必須です。\n\
    3. **同録（音声収録）への配慮**\n   * レシピ解説やインタビューを同時収録する場合、**幹線道路や線路沿いの騒音、冷蔵庫や換気扇のモーター音**が影響しないか（防音・同録対応かどうか）が重要です。\n\
    4. **備品（調理器具・食器）と設備**\n   * 鍋・フライパン・包丁・盛り付け用の皿・カトラリーがどこまで無料貸出されているか確認しましょう。俯瞰（真上からの手元）撮影用のアームや三脚の持ち込みやすさもポイントです。\n\
    5. **控室・サブキッチン（下ごしらえスペース）の有無**\n   * 品数が多いレシピ撮影では、メインキッチンの裏で別のスタッフが仕込み・差し替えを作れる「サブスペース」があると撮影がスムーズに進みます。\n\
    \n---\n\n### 3. 条件から探せるおすすめ検索サイト\n\n* **SHOOTEST（シューテスト）**\n  * プロ向けの撮影スタジオ検索サイト。「キッチン」「同録可能」「自然光」などの条件で細かく絞り込めます。\n\
    * **[R]studio（アールスタジオ）**\n  * 雑誌・広告・MVで使われるクオリティの高いハウススタジオが探せます。\n* **スペースマーケット / インスタベース**\n  * リーズナブルな時間貸しキッチン、隠れ家カフェ風、マンション一室タイプなど、手軽に借りられるスペースが都内数千件掲載されています。少人数・YouTube・SNS向けにおすすめです。\n\
    \n用途（「スチール写真」「動画配信」「WebCM」など）や予算規模、希望エリア（渋谷・新宿・港区など）に合わせて選定してみてください。"
