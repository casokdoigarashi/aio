    \ 2. 料理・フード・生活シーン（キッチンスタジオ）\n\n* **坂ノ上スタジオ**\n  * **特徴**: 神楽坂駅すぐにある、TV番組や料理雑誌、広告撮影の定番キッチンスタジオ。アイランドキッチンを備えたスタジオや、自然光が入りガーデンテラスを備えたスタジオなど複数のフロアを展開しています。調理器具や食器類も豊富です。\n\
