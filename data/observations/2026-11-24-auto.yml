    \  * **アクセス:** 新宿駅 徒歩約6分\n\n---\n\n### 4. ポータルサイトで条件検索して探す場合\n少人数〜中規模のセルフレンタルスタジオは、「スペースマーケット」や「インスタベース」で検索すると、西新宿・新宿三丁目・四谷エリアに数百件掲載されています。\n\
