    \n* **N1 STUDIO（エヌワンスタジオ）**\n  * **特徴**: 白Rホリゾントを備えた天井高3.5mの本格スタジオ。ストロボやLEDライトなどの撮影機材が無料で使えるほか、モルタル床のエリアや完全遮光でのライティング撮影にも対応しています。大型エレベーター完備で機材搬入もしやすいです。\n\
