    \ テイスト・目的別のおすすめ詳細\n\n#### 1. 白基調・透明感・抜け感を最重視したいなら\n* **青山 ART WORKS SKY（表参道・原宿）**\n  * **特徴**: 最上階に位置し、南西約9mの全面ガラス窓からたっぷり光が差し込む天空スタジオです。\n\
