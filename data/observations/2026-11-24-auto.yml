    - \nスタジオ カタツムリ（江東・清澄白河）：自然光豊富、黒基調のキッチンカウンターで物撮りや生活シーン撮影に。9,900円〜/1h\n\n- \nrom studio（渋谷）：3面採光、調理可能なステンレスキッチン・洗面台・バルコニー、プロップ充実。12,100円/1h\n\
