  answer_text: "用途やテイスト別に、キッチン常設で撮影実績のある都内スタジオを厳選してご紹介します。まずは「どんな絵を撮りたいか」で選ぶのが近道です。\n\n- 都心で選びやすい・複数拠点から内装テイストを選べる\n\
    \  Patia（パティア）［港・新宿・千代田 ほか全11拠点］\n  例：虎ノ門店（55㎡/7,040円～/h）、東麻布店（80㎡/ガスコンロ）、市ヶ谷店（127㎡/14,300円～/h）。全店Wi‑Fi、食器・調理器具が充実、9:00–23:00、最低5時間制。([patia-kitchen.jp](https://patia-kitchen.jp/filming/))\n\
    \n- 自然光たっぷり・広さ重視・ライフスタイル系に強い\n  Studio TERRANOVA “Studio D”（代々木上原）\n  143.7㎡のハウススタジオ。白基調のアイランドキッチン（3口コンロ＋コンビネーションレンジ）、3面採光、独立メイク2室、電源100V100A/最大20kVA。スチール/ムービー時間料金あり。([studio-terranova.com](https://www.studio-terranova.com/studio-d))\n\
    \n- 料理撮影に特化・コスパ重視\n  DFキッチンスタジオ（錦糸町/墨田区）\n  時間貸し7,000円/h（最低4h～）・8hパック45,000円。大型アイランド、3口ガス、南向き自然光、調理備品一式あり。([df-kitchen.net](https://df-kitchen.net/))\n\
    \n- 一軒家の“生活感”とホーム感\n  スタジオ・ネロリ（世田谷・若林）\n  一戸建て66㎡、アイランドキッチン＋ガス、調理器具/カトラリー多数。9:00–22:00、¥9,000/h（最低3h～）や6h/8h/10hパックあり。([studioneroli.com](https://studioneroli.com/))\n\
    \n- 南青山のスタイリッシュ空間\n  Studio rauque（表参道/南青山）\n  本格キッチン常設。撮影¥16,500/h（最低3h）、9:00–20:00。系列のロフトやカフェ空間も選択可。([studio-rauque.com](https://www.studio-rauque.com/))\n\
    \n- 大人数や同時進行に強い“2面キッチン”・IH運用\n  東麻布 LEMURE キッチンスタジオ（麻布十番/赤羽橋）\n  タカラスタンダード“レミュー”2台を同一フロアに設置（約100㎡）。全IH（ガス火なし）、控室/可動間仕切り/高速回線が整備。([shootest.jp](https://shootest.jp/wp-content/uploads/2024/06/HigashiAzabu-Lemure-KitchenSt_20240710.pdf))\n\
    \n- 駅前で可動式キッチン・同録想定\n  Studio Peak 北参道 “NATURAL KITCHEN”（渋谷・千駄ヶ谷）\n  約80㎡、可動式キッチンと可動壁。スチール22,000円/h・ムービー26,400円/h（各最低5h）、駐車3台（有料/要予約）。([crea.website](https://crea.website/en/locations/cmvpq1a0q000rnwq1s65k6rda))\n\
    \n- 料理教室系の雰囲気で小～中規模収録\n  Tokyo Cooking Studio（渋谷・富ヶ谷）\n  最大15名、撮影/収録は¥11,000/h（平日）。調理器具・清掃・ゴミ処理込み、最低3h。([tokyocookingstudio.com](https://www.tokyocookingstudio.com/rental-studio/))\n\
    \n探し方のコツ（要件ヒアリングのポイント）\n- 調理の有無と火力条件：ガス必須かIHで可か（例：パティア東麻布＝ガス、東麻布LEMURE＝IHのみ）。([patia-kitchen.jp](https://patia-kitchen.jp/filming/))\n\
    - 画づくり：生活感（ハウス系）か、スタジオ然とした白・モダンか。\n- 光条件：自然光重視か、遮光/ライティング前提か（例：TERRANOVA Dは3面採光）。([studio-terranova.com](https://www.studio-terranova.com/studio-d))\n\
    - 面積/天高・同録可否・電源容量（機材台数/配信有無で重要）。([studio-terranova.com](https://www.studio-terranova.com/studio-d))\n\
    - 料金体系と最低利用時間（スタジオにより3～5hなど差）。([patia-kitchen.jp](https://patia-kitchen.jp/filming/))\n\nさらに候補を網羅的に見たい場合は、キッチン付きスタジオのまとめサイト（ホワイトパンダ）でエリア/料金順の絞り込みも便利です。([whitepanda.jp](https://whitepanda.jp/studio/facility/4))\n\
    \nご希望をもう少し教えてください。\n- 撮影内容（静止画/動画/同録の有無）\n- 料理の実演や火気（ガス/IH）条件\n- 予定日・時間帯（例：2026年12月上旬/終日など）\n- 想定人数（出演/スタッフ）、必要電源容量\n\
    - エリア/アクセス条件、予算感\n\nいただければ、空き状況の確認と「最短動線で押さえられる候補」を2～3件に絞ってご提案します。"
