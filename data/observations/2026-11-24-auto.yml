    \n- スタジオ ココミール（恵比寿・代官山）\n  - 恵比寿／代官山から徒歩5分。プロ現場対応の本格キッチンで、カウンター実演や複数人の調理シーンに便利。 ([shootest.jp](https://shootest.jp/studio/s1609/?utm_source=openai))\n\
    \n- パトローネ 7studio（新宿・曙橋）\n  - 白ホリとセットを併設し、キッチンエリアは業務用の大型冷蔵・冷凍庫完備。多数カットを短時間で撮り切る案件にも相性◎。 ([shootest.jp](https://shootest.jp/studio/s1666/?utm_source=openai))\n\
    \n- ピノコ＆デイジー（世田谷・経堂）\n  - 仕込みと本番の場所を分けられるダブルキッチン。調理器具の貸出あり。駅から徒歩4分。 ([locationbox.metro.tokyo.lg.jp](https://www.locationbox.metro.tokyo.lg.jp/catalog/7821/?utm_source=openai))\n\
    \n- 美味しい料理の写真店 スタジオ（神楽坂）\n  - 料理撮影のための専用キッチンスタジオ。自然光と白基調で清潔感のある画が作りやすい。 ([ryori-shashin.com](https://ryori-shashin.com/studio-2/?utm_source=openai))\n\
    \n- rhombic studio（目黒）\n  - 「料理撮影に重点」のキッチンスタジオ。キッチンと物撮りセットが同空間にありテンポよく進行できます。 ([rhombic.jp](https://rhombic.jp/studio/01/?utm_source=openai))\n\
    \n- Patia（都内に多数）\n  - 複数店舗を展開するキッチンスタジオ。撮影用としての利用事例・推奨情報も公開されています。短時間のレシピ動画や配信にも使いやすい印象。 ([patia-kitchen.jp](https://patia-kitchen.jp/filming/?utm_source=openai))\n\
    \n- DCNキッチンスタジオ（中央区）\n  - シズル・料理番組・新メニュー撮影などを想定したキッチンスタジオ。白ホリ併設プランの実績もあり。 ([dcnstudio.zohosites.com](https://dcnstudio.zohosites.com/kitchen?utm_source=openai))\n\
    \n- studioTM（中央区・新富町／築地エリア）\n  - フードコーディネーター主宰。キッチン・撮影機材・調理家電・スタイリング備品までワンストップ。 ([studiotm3281.com](https://www.studiotm3281.com/?utm_source=openai))\n\
    \n選び方のコツ（失敗しにくいチェック項目）\n- 何を撮るかで「自然光の量」「キッチンの種類（ガス／IH、オーブン容量）」「サブキッチン・大型冷蔵冷凍庫の有無」を確認\n- 同録の有無（周辺環境・防音・近隣工事情報、夜間可否）\n\
    - 電源容量（ライト多用・IH多用時は特に）と換気性能\n- 荷捌き（駐車・台車動線・エレベーター寸法）\n- 撮影小物／調理器具の貸出範囲と持込可否、油煙・匂いのルール\n- 料金の刻み（最低利用時間・深夜早朝割増・控室の課金）\n\
    \nいくつか質問です。お答えいただければ最適案を2～3件まで絞って空き確認の代行メモも作れます。\n- 撮影内容：スチール／動画（YouTube／CM／番組など）、同録の要否\n- 予定日・時間帯（例：12月中旬の平日午前など）、想定拘束（○時間）\n\
    - 人数（演者／スタッフ）、仕込み量\n- 希望エリア（渋谷〜新宿〜港区など）とご予算目安\n- キッチン要件（ガス希望、二面キッチン、自然光の有無、白基調／ウッド系などのトーン）\n\nまずは上記から好みのテイストを教えてください。条件に合わせて空き状況の確認先と概算費用（本体料金＋控室＋清掃費など）を整理してお送りします。"
