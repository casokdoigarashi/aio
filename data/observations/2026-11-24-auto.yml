    3. **直射（ダイレクトサン）か拡散光（ディフューズ）か**\n   * レースカーテンの有無や、窓の外にベランダ・庭・隣接する建物があるかで光の強さが変わります。\n4. **最低利用時間と搬入経路**\n\
    \   * ハウススタジオは「最低利用3〜4時間から」という規定が多いため、短時間利用の場合は要注意です。\n\n---\n\n### 3. 条件から探せるおすすめ検索ポータル\n\n* **[SHOOTEST](https://shootest.jp/)**：自然光・ハウススタジオ・シーン別の検索がしやすく、写真の雰囲気が掴みやすい。\n\
