    *   **studio MUSHROOM（練馬区）**\n    *   **特徴**: 自然光の入る木目と白基調のナチュラルなキッチン・ダイニング。食品PRや家庭的なレシピ撮影に使いやすい設計。\n\
    \n---\n\n### 2. 【広さ・プロユース・動画収録】CM・TV・大人数撮影向け\n天井が高く、俯瞰（真上からの撮影）や大型照明・複数台カメラの設置がしやすいスタジオです。\n\n*  \
    \ **スタジオフィオーレ（目黒区）**\n    *   **特徴**: 大型アイランドキッチンを備え、同時調理や同録（音声収録）にも対応。広々としており、対面からのカメラや引きの画も余裕を持って狙えます。\n\
