    \ **Studio Licorne（リコルヌ / 下馬・三軒茶屋など）**\n  * フレンチカントリーやナチュラルなインテリア。一日中優しい自然光が入り、ポートレートやベビー・キッズ撮影にも人気。\n\
    * **UNDER THE TREE（世田谷区代田）**\n  * 実際の住空間のような温かみと生活感があり、ドラマや対談・インタビュー動画におすすめ。\n\n#### ③ アンティーク・ヴィンテージ・クラシック（雰囲気重視・世界観のある撮影）\n\
