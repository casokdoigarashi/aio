  answer_text: '要点だけ先に

    - ハウススタジオ＝生活空間をそのまま撮れる“家型”ロケーション。家具・小物・キッチン付き、自然光が魅力。住宅街に多く、音量・人数・時間の制限や搬入の制約が比較的厳しめ。

    - 撮影スタジオ＝白ホリや黒ホリ、可動セット、遮光・防音・電源が整った“箱型”。音声収録やライティングの自由度が高く、機材レンタルも充実。費用はやや高めになりがち。


    向いている用途

    - ライフスタイル・料理・雑誌取材・ECの着用カット：ハウススタジオ（自然光・生活感）

    - 商品切り抜き・ファッションの無機質背景・複雑な照明：撮影スタジオ（白ホリ・天井高）

    - 同録インタビュー・配信・ダンス：撮影スタジオ（防音・床耐荷重）

    - 和テイスト・旅館風：和室のあるハウススタジオ or 料亭の時間貸し


    料金の目安（東京相場の感覚）

    - ハウススタジオ：8,000〜20,000円/時（半日・1日パック有）

    - 一般的な白ホリ：12,000〜25,000円/時

    - 大型・本格防音：30,000円/時〜

    別途かかりがち…最低利用時間、延長、原状回復、同録料、商用利用料、ゴミ回収


    神楽坂で選ぶときのコツ

    - ロケーション特性：路地と坂が多く住居が密集。雰囲気は抜群だが、騒音・路上待機・車両の停車に厳しめ。搬入は台車前提で、近隣コインPやタイムテーブルを事前設計。

    - 光：建物が近く直射の“当たり時間”が短い物件も。南〜西向き窓は午後が狙い目。逆に安定光が欲しければ遮光できる撮影スタジオ。

    - 同録（音声）：幹線・工事音・店の換気音が乗りやすい路地もあるため、音重視は防音ルームのある撮影スタジオ推奨。

    - 建物事情：古民家・メゾネットは階段で搬入、天井が低め、床や畳の養生指定があることが多い。


    ロケハン時のチェックリスト

    1) 最低利用時間と延長単価、キャンセル規定

    2) 同録可否・外音状況（二重窓、空調音）

    3) 電源容量（100V/200V）・ブレーカー位置

    4) 搬入経路（階段/EV）・車両の停車可否・最寄りP

    5) 家具移動や壁貼りのルール（痕跡NG・フェルト必須など）

    6) 近隣配慮のルール（時間帯制限、外での待機NG）

    7) キッチン・水回りの実働可否、火気（ガスNG/IHのみ）

    8) 控室・メイク/フィッティングの広さ

    9) 背景幅（ペーパー2.7m等）・天井高・吊り込み可否

    10) 機材レンタル有無と持込料金

    11) 通信環境（配信なら上り実測）

    12) 公道や神社境内等を撮る場合の許可（道路使用など）の要否


    クイック判断フロー

