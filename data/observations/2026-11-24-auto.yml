    ## 無垢材フローリングが特徴のスタジオ


    **saut studio（南青山・外苑前）**

    外苑前駅から徒歩5分、南青山アドレスにあり、柔らかな自然光と白壁、無垢材のヘリンボーン床が魅力のシンプルで洗練された空間。商品撮影やECサイト用撮影、動画撮影、ライブ配信、雑誌取材まで幅広い商用利用に対応しています

    。

    青山エリアのシンプルなスタジオで6,930円/1hとリーズナブル。長方形ベースで無駄のない作りなので広さ以上に使い勝手が良く、アンティーク家具の組み合わせで様々なパターンの撮影が可能

    とも紹介されています。


    **studio南南西（世田谷区奥沢／東急・田園調布駅）**

    太陽いっぱいのサンルームとバスルーム、料理撮影のできるキッチン、無垢のフローリングを備えた、コンパクトで使い勝手の良いハウススタジオ

    。


    **多摩市のハウススタジオ（都心から車で約40分）**

    複数の住宅雑誌に掲載実績があるデザイン性の高いスタジオ。大きな梁が特徴で、無垢床や珪藻土などの自然素材、アンティーク家具にもこだわっており、映画やドラマのロケ地としても多く利用されているエリアなので外ロケとの併用もおすすめ

    。


