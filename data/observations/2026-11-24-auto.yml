    \  * **北向き / すりガラス・レースカーテン:** 均一で柔らかい拡散光（ソフトボックスで当てたような光）が一日中安定して入るため、肌の質感や物撮りに重宝されます。\n2. **天候への備え（曇り・雨天対策）**\n\
    \   * 万が一雨が降った場合、HMIや大光量LEDなどの定常光ライトを窓外や室内から焚ける広さ・機材レンタルがあるか確認しておくと安心です。\n3. **搬入経路・エレベーターの有無**\n\
    \   * ハウススタジオは古いビルや住宅地にあることが多いため、「エレベーターなしの4階」「駐車場がない」というケースがよくあります。\n\n---\n\n### 3. 条件に合うスタジオを探しやすいポータルサイト\n\
    \n* **[SHOOTEST（シューテスト）](https://shootest.jp/)**\n  * ハウススタジオの掲載数が豊富。「自然光」「南向き窓」「白壁」などの細かい条件で絞り込みやすい定番サイト。\n\
    * **[STUDIO SEARCH（スタジオサーチ）](https://www.studio-search.jp/)**\n  * プロユースから小規模向けまで、東京の撮影スタジオが網羅的に探せるポータル。\n\
    * **[スペースマーケット](https://www.spacemarket.com/) / [インスタベース](https://www.instabase.jp/)**\n  * 1時間単位の格安レンタルや、個人撮影・少人数のアパレル物撮り・ポートレート向けに探す場合に便利。\n\
