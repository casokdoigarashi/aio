  answer_text: 'ARIGATO Livingは、東京・神楽坂にある“北欧テイストのハウススタジオ”型レンタルスペースです。東・南向きの大きな窓から自然光が入る明るい空間に、ルイスポールセンやフリッツ・ハンセンなどの名作家具を配し、写真・動画撮影、オンライン配信、展示会や発表会、セミナー／ワークショップなど多目的に使えるのが特長です。運営がPR系のチームで、撮影機材の用意やカメラマン紹介、リリース作成などプロモーション面のサポートも依頼できます。([a-ms2.com](https://www.a-ms2.com/arigatoliving/concept/))


    主なポイント

    - 立地・規模: 新宿区東榎町4-2 神楽坂グリーンランドビル6F（神楽坂駅から徒歩数分）。面積はおよそ88〜90㎡のワンフロアで、仕切りカーテンでゾーニング可能。([shootest.jp](https://shootest.jp/studio/s1129/))

    - 用途: スチール／ムービー撮影、ライブ配信、商品発表会、会議・講座などに対応。キッチンも備え、料理撮影もしやすい構成。([a-ms2.com](https://www.a-ms2.com/arigatoliving/concept/))

    - 設備例: Wi‑Fi、プロジェクターやスクリーン、配信・照明機材、北欧家具など（無料備品多数）。([a-ms2.com](https://www.a-ms2.com/arigatoliving/faq/))

    - 収容目安: 最大で約40名（用途により調整）。([a-ms2.com](https://www.a-ms2.com/arigatoliving/faq/))

    - 音量・飲食等: 大音量や楽器演奏は不可（目安60dB）。飲食持ち込みは原則不可だが内容次第で相談可。スタジオ内は禁煙。([a-ms2.com](https://www.a-ms2.com/arigatoliving/faq/))

    - 料金の目安: 時間貸しで1時間あたり16,500円前後。基本は平日10:00–18:00を中心に、時間外は割増設定あり（詳細は予約時に確認）。([heyuse.jp](https://heyuse.jp/space/12760/))


    なお、公式サイト上では神楽坂のほかに銀座・いすみにも関連スタジオが掲載されています。具体的な利用目的（撮影内容や人数、時間帯など）を教えていただければ、適した使い方や見積りの目安もお伝えできます。([a-ms2.com](https://www.a-ms2.com/arigatoliving/faq/))'
