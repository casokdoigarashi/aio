    ## 自然光ハウススタジオの探し方（東京）


    **主な検索プラットフォーム**

    - **スタジオ検索サイト**：Studio BAUS（バウス）、スタジオトップス、Photo Studio Search など

    - **スペースシェア系**：スペースマーケット、インスタベース、スペイシー（1時間単位・数千円〜で借りやすい）

    - 検索時のキーワード：「自然光」「白ホリ」「南向き」「大窓」「ナチュラル」「一軒家」


    **エリアの傾向**

    - **世田谷・目黒・杉並**：一軒家改装型のハウススタジオが多い。庭付き・木の床など生活感のあるナチュラル系

    - **渋谷・代官山・中目黒**：デザイナーズ系、白基調でアパレル撮影向き

    - **江東・墨田・江戸川**：倉庫・元工場リノベ系。天井が高く大窓、面積が広い割に安い

    - **港区・中央区**：高層階・眺望あり。時間帯で光が大きく変わる


    ## 選ぶときのチェックポイント


    1. **窓の方角と時間帯** — 南向きは日中安定、東向きは午前、西向きは夕方の斜光。直射が強すぎる場合はレースカーテン・ディフューザーの有無を確認

    2. **撮影日の季節** — 冬は日照時間が短く、15時頃には暗くなる。予備の定常光/ストロボが借りられるか

    3. **床・壁の色** — 白壁＋白木床はレフ効果が高く、自然光だけでも明るく撮れる

    4. **料金体系** — 平日/休日、機材レンタル、スタッフ立ち会い、搬入出時間が料金内か

    5. **付帯設備** — 電源容量、Wi-Fi、キッチン、着替えスペース、駐車場、エレベーターの有無


    ## 予算の目安

    - スペースシェア系の小規模ハウススタジオ：**3,000〜8,000円/時**

    - 専業ハウススタジオ（一軒家まるごと）：**10,000〜30,000円/時**、または半日/1日パック


