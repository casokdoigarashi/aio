    4. **生活空間（キッチン・ベッド・ダイニング）のレイアウト**\n   * カタログやSNS用撮影などで「食卓」「リビング」「寝室」など複数のシチュエーションが必要な場合、ワンフロアでそれらがつながっているか確認しましょう。\n\
