    * **主なエリア：** 表参道・青山・渋谷・恵比寿\n* **特徴：** 天井が高く、全面ガラス張りや大きな開口部を備えた都市型スタジオ。白壁・無垢材の床・コンクリート打ちっぱなしなどスタイリッシュな空間が特徴です。\n\
    * **代表的なスタジオ例：**\n  * **青山 ART WORKS SKY / 表参道 ART WORKS WHITE（渋谷区神宮前）**：南・南西に大きな窓があり、天井高と広大な光の広がりが魅力の白基調スタジオ。\n\
