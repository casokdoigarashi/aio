    * **主なエリア：** 神楽坂、丸の内・日本橋、品川・目黒周辺\n* **特徴：** リアルなリビング、ダイニング、可動式キッチン、浴室などを完備。CM撮影や生活雑貨・フード撮影に最適です。\n\
    * **代表的なスタジオ例：**\n  * **say studio（文京区/神楽坂・飯田橋）**：3面採光で明るく、使いやすいアイランドキッチンを備えたナチュラル空間。\n  * **LAG SPACE\
