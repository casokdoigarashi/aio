  answer_text: '東京で「対談（インタビュー）撮影」に向くスタジオをお探しですね。条件を少し教えていただければ、候補をリストアップして空き状況・料金も確認してご提案します。


    希望条件（わかる範囲で）

    - 撮影日・時間帯（例：12月上旬 平日午前、12:00–16:00 など）

    - 予算感（税別・時間あたり or 1日あたりの上限）

    - エリア（山手線内/渋谷〜新宿周辺/東側など）

    - 人数（出演者・スタッフ合計）、想定の控室数

    - 雰囲気・背景の希望（白ホリ/オフィス調/カフェ調/和室/黒バック/ブラインド越し窓 など）

    - 音条件（完全防音必須/ある程度で可、外音NGレベル）

    - 備品ニーズ（椅子・テーブル・バックスクリーン・グリーンバック・メイク台）

    - 機材レンタル要否（ライト/ミキサー/ガンマイク/レンズ/三脚 など）

    - 駐車場・エレベーター・搬入条件

    - 言語サポート（日本語のみ/英語対応希望）


    選び方のポイント（対談撮影向け）

    - 防音・空調音：外音と空調ノイズの少なさを最優先

    - 天井高と奥行き：カメラ2–3台で引きが取れるか（被写体〜背面3m以上あると楽）

    - 電源：2–3kWを安全に確保できるか（ブレーカー位置も要確認）

    - 反響：ライブ気味ならカーペット/吸音材の有無を確認

    - 控室・同録導線：控室が別室で静かなこと


    ご希望をいただければ、条件に合うスタジオを5〜7件（料金帯/最寄駅/防音度/備品有無つき）で最新情報を調べてご提案します。まずは上の項目を教えてください。'
