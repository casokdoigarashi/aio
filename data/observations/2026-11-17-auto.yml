    - パンダスタジオ 日本橋浜町（中央区）: クロマキー収録可。眺望を活かした背景も選べ、複数の収録部屋を備える大型拠点。([pandastudio.tv](https://www.pandastudio.tv/wp-content/uploads/2023/10/a0b26bfe96fdcb828ec7a09426f8b9f9.pdf?utm_source=openai))

    - 渋谷セレクトスペース（渋谷駅徒歩4分）: 木目/白レンガ/ホリゾント/グリーンバックなど背景切替でトーク番組・対談・生配信に対応。控室も同ビル。([shibuya-select-space.com](https://www.shibuya-select-space.com/?utm_source=openai))


