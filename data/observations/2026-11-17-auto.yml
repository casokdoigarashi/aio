    \  2スタジオ＋控室。配信/撮影の技術スタッフ手配可、同録実績あり。基本は4時間〜でセットプランもあり。グリーンバック対応・専用回線あり。([exstudio.pro](https://exstudio.pro/userguide/?utm_source=openai))\n\
    \n- ONE STOP STUDIO TOKYO（神田3分・千代田区）\n  白ホリ/グリーンバック。スタジオは4時間〜、目安は15,000〜20,000円/時（税別）。照明・4Kカメラ等レンタルやスタッフ手配も可能。([1stop-studio.tokyo](https://www.1stop-studio.tokyo/about/?utm_source=openai))\n\
    \n- Studio HISOKA（外苑前4分・渋谷区）\n  24時間営業の白ホリ系。時間貸しで小規模インタビュー向き。機材使い放題オプションあり。([studiohisoka.com](https://www.studiohisoka.com/?utm_source=openai))\n\
    \n- スタジオポリゴンズ（浅草1分・台東区）\n  白ホリ/クロマキー対応。天吊りプリセット照明あり。最小Cスタジオは4時間パックが基本。([studio.polygons.jp](https://studio.polygons.jp/schedule.html))\n\
    \n- 渋谷明治通りスタジオ（渋谷1分・渋谷区）\n  小規模対談/インタビュー向け。1時間から、LED照明2灯と三脚込み。短時間収録のコスパ重視に。([editor-camp.jp](https://editor-camp.jp/tokyo-youtube-studio/))\n\
    \n- G-angle Studio（恵比寿・渋谷区）\n  MA/録音系の防音スタジオだが、カメラを入れてインタビュー撮影も可。音重視の収録に。([g-angle.co.jp](https://www.g-angle.co.jp/studio/?utm_source=openai))\n\
    \n補足\n- 直近の相場感（2026年10月時点の整理）：1時間貸し小規模は3,000〜6,000円台/時、設備・控室・スタッフが付く収録系は多くが4時間〜で実質7,700〜22,000円/時が目安。([editor-camp.jp](https://editor-camp.jp/tokyo-youtube-studio/))\n\
    - 同録重視なら、空調音・外音・残響の確認（内覧or実績）と上り回線の安定性チェックが重要です。([studiomall.jp](https://studiomall.jp/studio-guide/studio-selection/article-45669/?utm_source=openai))\n\
    \nいくつか条件を教えてください。最短で空きまで当たって候補を絞ります。\n- 収録日・時間帯（例：11月○日 午前/午後）\n- 人数と画角（1人／2人対談／3人以上）\n- 背景の希望（白／オフィス風／グリーンバック）\n\
    - 音の優先度（同録の有無）\n- 予算目安と希望エリア（千代田・渋谷・新宿など）\n- 機材やスタッフの要否（カメラ・照明・音声・スイッチング等）"
