    *   **BASK Waseda（新宿区・早稲田）**\n    *   4面採光で終日明るいスタジオ。モルタルやウッド、ニュアンスのある白壁で、アパレルやインテリア雑貨の撮影に人気です。\n\
    *   **LAG SPACE Shinjuku（新宿・代々木）**\n    *   高い天井と一面の大開口窓から光が差し込むスタイリッシュなスタジオ。新宿副都心の抜け感を活かした撮影も可能です。\n\
    \n#### ③ 海外風・アンティーク・ヴィンテージ（雰囲気重視、世界観のある撮影）\n*   **Studio EASE（品川区・西五反田 / 目黒）**\n    *   ヨーロッパの街並みのような屋外セットや、アンティーク家具が揃う広大なスタジオ。窓や天窓からの光を活かしたドラマチックな画が撮れます。\n\
