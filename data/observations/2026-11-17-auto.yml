  answer_text: "都内のインタビュー撮影向けスタジオについて、調べた範囲でまとめます。\n\n## 選ぶときの基準（インタビュー撮影特有）\n\n1. **防音・同録対応** — 音声が命なので最優先。空調音・外音・エレベーター音が入らないか要確認\n\
    2. **背景** — 白ホリ/クロマキー（グリーンバック）か、オフィス・ラウンジ風の「画になる壁」か\n3. **天井高と奥行き** — 背景をぼかすため被写体と背景の距離が2m以上とれると理想\n\
    4. **控室・メイクルーム** — 出演者が社外の方（取材対象者）の場合はほぼ必須\n5. **最低利用時間** — 1時間から借りられる所と、4時間以上の所がある\n\n## 価格帯の目安\n\
    \n**〜5,000円/時間（小規模・1人インタビュー向け）**\nSTUDIO 4696 青山店 第1スタジオは幅4.1m×奥行7.7m×天井高2.9m（60平米）で1時間4,928円〜、最低1時間から、機材・電気代無料\n\
    。\nスタジオルミス 青山は渋谷駅徒歩1分で、スチールからムービーまで撮影内容に関わらず一律1時間3,500円、撮影機材一式は1時間1,000円で使い放題、メイクルーム完備\n。\n\n**5,000〜10,000円/時間（本格的な白ホリ・防音）**\n\
    STUDIO KOTOBUKIは横幅9m・奥行7.6m・天井高4.8mの2面R白ホリで、グリーン布・黒バック布でクロマキーや黒ホリ撮影も可能、MV・同録・配信にも対応して6,980円/時間〜\n\
    。\n外苑前駅徒歩3分で自然光と完全防音を両立したスタジオは法人8,690〜10,648円/時間、有線LANで下り770Mbps・上り150Mbpsと4K配信にも強い\n。\n\n**ハイエンド（配信・放送品質）**\n\
    ワンストップスタジオ東京の大型白ホリ・グリーンバックスタジオは20,000円/時間（最低4時間）で、防音・吸音構造により外部音の遮断と残響の抑制を両立し、ナレーション収録や対談・セミナー収録など同録が必要な現場に向く\n\
    。\n撮影代行込みのプランもあり、全面防音の白ホリスタジオ＋出演者1名想定の機材セットで150,000円/4h、対談や講演のクロマキー撮影など2〜3名向けは298,000円/4〜8h\n。\n\n\
    ## 探し方\n\n- **白ホリドットコム** — \n東京都内の白ホリゾントスタジオを195件掲載\n、\n同録実績・防音設備・メイクルーム・有線LANなどの条件で絞り込める\nので、インタビュー用途の検索に向いています\n\
    - インスタベース / スペースマーケット — 1〜2時間の小規模撮影なら最安\n- 具体的な条件（予算／人数／ロケ地エリア／背景の希望／撮影日）を教えていただければ、さらに絞り込んで提案できます。"
