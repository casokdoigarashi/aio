    \ ([shootest.jp](https://shootest.jp/studio/s1600/))\n\n- ARIGATO Living 神楽坂（東榎町・同ビル6F）\n  北欧テイストの自然光スタジオ。約89.6㎡、神楽坂駅徒歩6分。料金は27,000円/時〜（最低3時間）。展示会や配信、小規模イベントにも。\
