    \n- 坂ノ上スタジオ（天神町・神楽坂徒歩2–3分）\n  自然光の入るガーデンテラス付きのキッチンスタジオ。料理・収録に強く、2026年8月からインクルーシブ料金に刷新。目安はAスタ¥14,850〜/時、Cスタ¥17,050〜/時。駐車場あり。\
