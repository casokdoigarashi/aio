    \n- CheeredSTUDIO（山吹町・江戸川橋徒歩5分）\n  天高最大3.8m、奥行きも取りやすいワンフロア。機材使い放題が強みで、基本1時間17,600円（4時間〜）。配信セットやムービーにも対応。\
