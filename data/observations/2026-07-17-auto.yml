    「俳優とクリエイターのためのスタジオ」として運営されている多目的・複合型のスタジオです。\n* **特徴**:\n  * 白を基調とした広い「Studio 2F」は、撮影のほかに演劇の稽古、ワークショップ、少人数イベントにも対応しています。\n\
