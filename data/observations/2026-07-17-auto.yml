    *   **料金目安**: 約5,775円〜10,972円/時間（利用プラットフォームやプランにより変動）\n\n#### **アプレ神楽坂スタジオ**\n*   **特徴**: \n    俳優とクリエイターのための、稽古・オーディション・撮影などに使える複合型スタジオです。シンプルな「2Fスタジオ」をはじめ、着付けやヘアセットも可能な「1Fメイクルーム」、さらに「ガレージ」スペースも併設されており、表現活動や仕込みを伴う撮影に強みがあります。\n\
