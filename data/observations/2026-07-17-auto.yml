    \  * 無垢材の床に、北欧の一流ブランド「フリッツ・ハンセン」のソファやテーブルが配され、シンプルながら洗練されたインテリアが特徴。\n  * レシピ撮影に適した**カウンターキッチン**や、スキンケア商品の撮影に使えるモダンな洗面台を完備。\n\
