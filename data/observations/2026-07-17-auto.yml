    * **広さ**: 約80㎡。\n\n---\n\n### 3. ヴィンテージ・アパレルEC向け\n#### **スタジオミームリンク（memelink）**\nニュアンスの異なる2つのオシャレな部屋（Room\
    \ A・Room B）を使い分けられるマンションタイプのハウススタジオです。\n* **特徴**:\n  * **Room A**: インダストリアル（工業的）な空間で、ヴィンテージブリック（レンガ）やコンクリート風の壁、レザーソファなど男前でクラシックな雰囲気を演出できます。\n\
