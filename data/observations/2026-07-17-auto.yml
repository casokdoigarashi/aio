    * **おすすめの用途**: MV・PV撮影、番組の収録、対談、クロマキー合成を要するスチール・動画、生配信。\n* **アクセス**: 東京メトロ有楽町線「江戸川橋駅」徒歩5分、東西線「神楽坂駅」徒歩8分。\n\
    * **広さ**: 80㎡。\n\n---\n\n### 5. 幻想的な「水撮影」やコスプレ・創作向け\n#### **Studio Garden Quartz（スタジオガーデンクォーツ）**\n\
