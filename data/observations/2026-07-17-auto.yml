    \ 2Fスタジオ：9,700円/時間\n\n---\n\n### 神楽坂でスタジオを選ぶ際のポイント\n*   **「自然光」の有無と方角**:\n    ARIGATO Livingやshucofなどは安定した自然光が入りますが、午前中と午後で光の入り方が変わるため、ロケハンや問い合わせ時に日当たりのピーク時間を確認することをおすすめします。\n\
