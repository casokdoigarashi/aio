    ### 3. shucof（シュコフ）神楽坂\n* **特徴**: モルタルとホワイトを基調とした、無機質かつ温かみのある広いスペース（184㎡）。\n* **魅力ポイント**:\n  * 古材や漆喰壁、アンティークガラスの建具など、味のある背景が随所に散りばめられています。\n\
    \  * 大きなガラス扉から自然光がたっぷりと入るほか、都心の眺望を背景に撮影できる「ルーフトップ（屋上）」も事前申請で利用可能。\n  * 広いワンフロアのため、物撮り・人物・インタビュー・対談など、レイアウトを柔軟に変更して何パターンもの撮影が一度に行えます。\n\
    * **アクセス**: 東西線「神楽坂駅」1番出口より徒歩7分、有楽町線「江戸川橋駅」4番出口より徒歩7分。\n\n### 4. 神楽坂スタジオ\n* **特徴**: 閑静な住宅街にある、白壁・レンガ・コンクリート調など多彩な背景を持つナチュラル＆ヴィンテージテイストのスタジオ（約100㎡）。\n\
    * **魅力ポイント**:\n  * 天井高は最大3.3mと開放的で、南向きの木枠窓から心地よい自然光が入ります。\n  * アンティーク風の家具やソファ、トルソーといった小物が非常に充実しており、アパレルやEC、ポートレートに最適。\n\
