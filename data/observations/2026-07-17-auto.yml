    \ 約89㎡。\n\n---\n\n### 2. 豊富な背景・本格ポートレート向け\n#### **神楽坂スタジオ**\n閑静な住宅街にある、天井高3.3mの広々としたマルチ背景ハウススタジオです。\n\
    * **特徴**:\n  * **漆喰壁、コンクリート壁、レンガ壁、リバーシブルな木床**など、1つのスタジオ内で何パターンものシチュエーション撮影が可能。\n  * ワイド幅の白バックペーパーも常設されており、白ホリゾントの代用としても使用できます。\n\
    \  * 室内灯がフリッカーレス仕様になっており、特別な照明を使わなくてもスマートフォンでのスローモーションや動画撮影が綺麗に行えます。\n  * 専用駐車場が1台分完備されているのも大きなメリットです。\n\
