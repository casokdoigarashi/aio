    \n### 3. ショールーム・洗練されたモダンインテリア系スタジオ\n\n- Brandze Studio / Goblinスペース等（目黒・渋谷エリア） [3] [4]\n  - 特徴: イタリアや北欧のデザイン家具、照明をしつらえたインテリアショールーム・レンタルスペース。ウッドベースの落ち着いた空間。\n\
    \  - 用途: 対談、インタビュー、洗練された生活シーンの撮影。\n  - 詳細: [Goblin.（ゴブリン）](https://goblinspace.jp/feature/house-studio/)\n\
