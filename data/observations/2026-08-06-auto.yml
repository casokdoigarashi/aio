  answer_text: '「北欧家具のあるハウススタジオ」で撮影場所をお探しということで合っていますか？


    差し支えなければ、次を教えてください。

    - 希望エリア（国・都市／最寄り駅）

    - 撮影日・時間帯（例：2026-08-20 9:00–15:00）

    - 用途（スチール／動画／人物／商品など）と人数

    - 予算（1時間あたり or 1日）

    - 必要条件（自然光の向き・時間帯、広さ・天井高、白壁／木床、キッチン有無、駐車場、音出し可否、家具や小物の持ち込み可否）

    - 北欧テイストのこだわり（例：ヴィンテージ中心／IKEA風で可、色味、ブランド例：Artek・Carl Hansen・HAY・Muuto など）


    いただければ、最新の空き状況と料金を調べて、条件に合う候補を3–5件に絞って比較提案します。ウェブでの調査に進めてよいかも一言お願いします。'
