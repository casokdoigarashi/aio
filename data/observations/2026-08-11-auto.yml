    - マドモアゼル（池袋） [2]\n  - 特徴: 天井高約 3.85m の開放感。フランスアンティーク家具とたっぷりの自然光が特徴の、絵画のような雰囲気が作れるスタジオです。 \\(https://studiokensaku.com/?cat=101\\\
    )\n\n### 3. 一軒家・広め・邸宅・グリーン系\n\n- 特徴: 光と緑があふれる空間。リアルなグリーンや北欧テイストの背景が揃い、都内にいながら自然豊かなロケーションにいるような柔らかな光での撮影が可能です。\n\
