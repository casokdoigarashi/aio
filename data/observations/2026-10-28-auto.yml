  answer_text: "code\n都内でインタビュー撮影ができるスタジオ探しですね。検索結果をもとに、選び方とタイプ別の候補をまとめます。\n\n## 1. インタビュー撮影でスタジオを選ぶときの要点\n\
    \n| チェック項目 | 理由 |\n|---|---|\n| **同録（音声収録）可否** | インタビューは音が命。「音出し・録音不可」の部屋もあるので要確認 |\n| **防音・空調音**\
    \ | エアコン停止が必要な場合も。静音環境かどうか |\n| **引き（奥行き）** | 望遠気味で背景をボカすには被写体〜背景に3m以上欲しい |\n| **天井高** | 3m以上あるとライトスタンド・トップライトが自由\
    \ |\n| **控室・メイクルーム** | 出演者の待機、着替え、資料確認用 |\n| **機材込みか** | 照明・背景紙込みだと総額が安くなるケースが多い |\n\n## 2. タイプ別の候補\n\
    \n**■ 白ホリ／グリーンバック（テロップ合成・企業VP向け）**\n- \nワンストップスタジオ東京（神田駅徒歩3分）：STUDIO1が¥18,000/h、STUDIO2が¥20,000/h、STUDIO3が¥15,000/h（※STUDIO3は音声収録不可、控室利用可）\n\
    。\n照明機材セットの「撮影スタジオ＋照明プランS」は¥140,000〜/4hで、出演者1名分のLEDが準備された状態\nとのこと。\n- \nスタジオd21（四谷・88㎡、11,000円/1時間）は防音設備を備えた同録撮影が可能なホリゾントスタジオ\n\
    \ → **インタビュー同録に相性が良いタイプ**。\n\n**■ 低予算・1〜2名の短時間インタビュー**\n- \nスタジオ ルミス（渋谷駅徒歩1分）は撮影内容に関わらず一律3,500円/1時間、撮影機材一式1,000円/1時間で使い放題\n\
    。\n- \nSTUDIO 4696 青山店 第1スタジオ（60平米・天井高2.9m）は1時間4,928円〜、機材・電気代無料\n。\n\n**■ 生活感・雰囲気のある背景が欲しい場合（ハウススタジオ）**\n\
    - \nサンスタジオ 江戸川大杉ビル3A「屋根裏カフェスタジオ」はトークシーンの撮影にも最適で11,000円〜/1h\n、\n同3B「インダストリアルバースタジオ」もトークシーン向けで11,000円〜/1h\n\
    。\n\n## 3. 探すのに便利なポータル\n- \n白ホリドットコム（東京都内の白ホリゾントスタジオ一覧、124件掲載）\n\n- \nshootest（東京都内・近郊の撮影スタジオ一覧）\n\
    \n\n## 4. 予算の目安\n- 1名インタビュー・2〜3時間撮影：スタジオ代 **1.5万〜5万円**（自前機材・自前クルーの場合）\n- 照明・音声スタッフ込みのパッケージ：\n白ホリゾント撮影プランで¥175,000〜/4h\n\
    クラス\n\nもしよければ、**①出演者の人数 ②希望の背景（白ホリ／オフィス風／ナチュラル）③撮影日時と時間数 ④予算 ⑤機材・スタッフは自前かどうか**を教えていただければ、条件に合う候補を絞り込んでご提案します。"
