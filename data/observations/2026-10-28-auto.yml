  answer_text: '東京で「自然光がきれいなハウススタジオ」をお探しですね。まずは用途（スチール/ムービー）、希望エリア、広さ・天井高、予算、内装テイスト（ナチュラル/白壁/北欧/無機質など）、キッチン・屋上・庭の要否、撮影時間帯を教えてください。下記は自然光で評判のスタジオ候補です。


    - studio CUBE（目黒区・約100㎡）南向きの大窓＋テラス/屋上付きで日差しが入りやすい構成。雑誌やインタビュー実績多。([st-cube.com](https://st-cube.com/))

    - ViewStudio Suidoubashi（水道橋・約85㎡）駅1分。直射・自然光が入るサンルーム（西向き記載）／24時間利用可。([viewstudio.jp](https://viewstudio.jp/en/))

    - Haku Studio - W -（世田谷・野沢）2Fの大窓でやわらかな自然光。料金目安（平日）スチール17,600円/h〜、ムービー22,000円/h〜、9:00–18:00、最低4h。([hakustudio.com](https://hakustudio.com/w/))

    - HEYA（北区・田端/西日暮里）朝夕にやわらかな自然光。キッチン併設の住空間系。([heya.lamm.tokyo](https://heya.lamm.tokyo/))

    - AurA（勝どき）天井高約9m。2Fは“天窓からの自然光”、1Fは白背景など多用途。([aura-st.com](https://aura-st.com/about/))

    - Studio TERRANOVA／TERRANOVA House（代々木上原）自然光の入る各スタジオとハウス型スペースを展開。白ホリやキッチン付き区画も。([en.studio-terranova.com](https://www.en.studio-terranova.com/studio-all))

    - EARLY（大田区・千鳥）約213㎡。東・南・西に面したサンルームで全面に自然光、窓裏ライティング可。([garden-studio.com](https://www.garden-studio.com/wp-content/uploads/2023/12/EARLY%E7%B4%B9%E4%BB%8B%E3%82%B7%E3%83%BC%E3%83%8820250623-2.pdf))

    - Roppongi HOUSEstudio（港区・六本木一丁目）自然光が入る3階建て3LDK。キッチン/寝室/バルコニー完備。([rental-st.coody-t.com](https://rental-st.coody-t.com/wp-content/themes/rental-st/pdf/roppongiMitori.pdf))


    比較サイト・特集

    - [R]studio「自然光スタジオ特集」：南向きや天窓など“光がウリ”の都内スタジオを厳選。([rstudio.co.jp](https://www.rstudio.co.jp/topic/7097/))

    - インスタベース「東京都・自然光が入る撮影スタジオTOP20」：即時予約可の物件を横断検索。([instabase.jp](https://www.instabase.jp/tokyo/list/natural-light-shooting?utm_source=openai))


    選び方の簡単メモ

    - 光の向きと時間帯で表情が変わります（東＝午前、西＝午後、南＝季節で角度変化、北＝終日安定の拡散光）。

    - サンルームや天窓は直射が得やすい一方で夏は熱くなることも。遮光/換気の可否を内見で確認。

    - 料理撮影は実働キッチン、ムービーは電源容量/防音、人物は控室とメイク環境をチェック。


    条件が決まっていれば、日程とご要望（例：朝の自然光で白壁、キッチン必須、50㎡以上、予算1.5万円/h以内など）を教えてください。最適な候補に絞り込み、空き状況の確認手順までご案内します。'
