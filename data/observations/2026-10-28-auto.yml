    3. **床材と壁の質感**\n   * 北欧家具は「無垢材のヘリンボーンフローリング」や「明るいオーク床」、あるいはコントラストが出る「モルタル床」とよく合います。商品や衣装のトーンに合わせた床材を選びましょう。\n\
