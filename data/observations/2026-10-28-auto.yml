  answer_text: '東京で「対談」撮影ができるスタジオをお探しですね。条件を教えていただければ、空き状況と料金を含めて最適な候補を絞ってご提案します。


    教えてほしい項目

    - 実施日・時間帯（第1〜第3希望）

    - 人数と構成（例：2名対談＋モデレーター1名）

    - 収録形態：映像＋音声／音声のみ／ライブ配信の有無

    - 希望の画（白ホリ／黒バック／オフィス風／ソファ対談 など）

    - 予算感（時間あたり or パック上限）

    - エリア希望（例：渋谷・新宿・六本木・銀座・秋葉原 など）

    - 必要設備：照明グリッド／同録可の防音／控室・メイク／駐車場／英語対応スタッフ など

    - 機材・スタッフ：スタジオ側に一式依頼／機材持込


    まずは上記をお知らせください。いただければ最新の料金・空きとともに3〜5件の候補を提示します。'
