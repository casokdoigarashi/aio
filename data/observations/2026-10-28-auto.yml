    * **ミモザハウス**（渋谷区神山町）\n  * カントリー調やシャビーシックなインテリアと庭・サンルームがあり、柔らかい光が回る空間。\n\n---\n\n### 2. 自然光スタジオを選ぶ際のポイント\n\
