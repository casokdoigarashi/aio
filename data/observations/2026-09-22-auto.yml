    5. **料金体系**：時間単位か半日/1日か、深夜料金・搬入搬出時間の扱い、電気（W数）や機材レンタル代の別途課金。

    6. **下見（ロケハン）**：無料下見が可能なスタジオを選び、実際の光と家具を確認するのが確実です。


