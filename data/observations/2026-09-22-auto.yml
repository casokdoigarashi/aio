    *   **STUDIO EASE（スタジオイーズ）** / 目黒など\n    *   ヨーロッパの街並みやアンティークが有名ですが、ナチュラルモダンやウッドベースの北欧風シチュエーションが組める空間も用意されています。\n\
    *   **Balus Studio（バールススタジオ）** / 目黒・世田谷など\n    *   シンプルで上質な北欧モダンテイストの家具が揃い、アパレルのルック撮影や日用品・コスメの撮影に人気です。\n\
    *   **ECOLO STUDIO（エコロスタジオ）** / 大田区など\n    *   光がたっぷり入る白壁×フローリングの空間に、木目が美しい北欧ヴィンテージ家具（チーク材やオーク材のチェア・チェストなど）が豊富に揃っています。\n\
