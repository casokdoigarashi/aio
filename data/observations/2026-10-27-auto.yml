    \ — \n「おしゃれな撮影スタジオ」として上位に挙げられる常連で、飲食物の持ち込みも可能\n。\n\n## 少人数・低予算向け\n**レンタルスペース8（hachi）** — \n神楽坂駅徒歩1分のレトロな多目的スペース。完全個室で撮影スタジオ・動画配信・インタビュースペースとして使え、25㎡・〜8名、評価4.9\n\
    。駅近なので機材搬入もラクです。\n\n**正豊ビル（キューブスタジオ／ウィザースタジオ／マルチスタジオ）** — \n人気スペースの常連で、少人数利用にも対応\n。\nキューブスタジオは当日予約が取りやすいのも利点\n\
