    \  - 注意: ペースメーカー等の医療機器使用中、てんかん、妊娠中、皮膚疾患部位は使用不可。\n\n- フットバス（足湯）／足温器・ヒーター内蔵フットレスト\n  - 特徴: 末梢の冷えを抑えて血流改善。冷房の強い職場や冬に有効。\n\
