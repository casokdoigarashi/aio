  answer_text: "用途や好みで“合う機種”が変わるので、まずはタイプ別の選び方と向いている人を簡潔にまとめます。ご希望を教えていただければ、最新モデルと価格（日本/米国いずれでも）を絞り込んでご提案します。\n\
    \nタイプ別の選び方\n- エアー圧迫（巻き付けブーツ型）\n  - 向き：むくみ・冷え・立ち/座りっぱなし対策。両脚同時に楽したい人。\n  - 特徴：自動プログラム、強さ段階多め。ヒーター付きもあり。ややポンプ音あり。\n\
    - 据え置きフット＆カーフ（足を差し込む筐体）\n  - 向き：強めの揉み＋圧迫でしっかりほぐしたい人、足裏も同時にケアしたい人。\n  - 特徴：場所は取るがパワーと安定感。静音性は比較的良好。\n\
    - マッサージガン（ピンポイント振動・打撃）\n  - 向き：運動後のリカバリーや筋膜リリース。ふくらはぎ外側・内側・ヒラメ筋を狙い撃ち。\n  - 特徴：携帯性○、短時間でコリに効く。自分で当てる手間はあり。\n\
    - EMS/電気刺激パッド・ボード\n  - 向き：ながらでポンプ作用を促したい人、超静音重視。\n  - 特徴：個人差が大きい。パッド等の消耗品コストあり。\n\n選ぶときのチェックポイント\n\
    - 圧力と強さ段階（エアーは段階10前後あると微調整しやすい）\n- サイズ調整（ふくらはぎ周径、延長バンド有無）\n- ヒーター（約40–45℃が快適）、タイマー（15–20分）、自動オフ\n\
    - 静音性（就寝前に使うなら50dB以下目安）\n- 収納性・重さ（据え置きは大きめ、ブーツ型は畳める）\n- 電源（コードレス/充電式か、電圧100V/110–120V対応）\n- お手入れ（内カバー取り外し・洗えるか）、保証期間\n\
    \n安全上の注意\n- 深部静脈血栓症、重度の静脈瘤、心疾患、妊娠後期、糖尿病の末梢神経障害、皮膚疾患がある場合は使用前に医師へ。痛みやしびれが出る/続く場合は中止。\n- 1回20分前後、食後や入浴直後は強圧を避ける。\n\
    \nいくつか質問させてください（答えられる範囲でOK）\n1) 主目的：むくみ軽減／疲労回復（運動後）／コリほぐし（強め）／静音・ながら重視のどれが最優先？\n2) 予算の目安（円またはUSドル）\n\
    3) 置き場所やサイズ制約はありますか？（据え置き可／畳める方が良い）\n4) 希望の機能：ヒーター／コードレス／リモコン／洗える内カバー など\n5) ふくらはぎの周囲長（大まかで可）と、足首〜太ももまでの広範囲ケア希望の有無\n\
    6) ご購入地域（日本/米国ほか）と通販/店頭の希望\n\nご回答いただければ、最新のおすすめ機種を候補3〜5点に絞って比較（長所・短所・価格帯）をご提案します。"
