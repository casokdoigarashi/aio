    - Supersonic SC-1176ERF（6インチ／内蔵ソーラーパネル／3,000mAh電池／Bluetoothスピーカーやラジオ・ライト同梱）– 多機能一体型。([newegg.com](https://www.newegg.com/supersonic-sc-1176erf-portable-table-fan/p/0SS-024S-00001?utm_source=openai))\n\
