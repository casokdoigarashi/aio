    \n*   **巻きつけ・ブーツ型（エアー式に多い）**\n    *   脚に面ファスナーで巻きつけるタイプ。\n    *   **メリット：** 使わないときは折りたたんでコンパクトに収納可能。ソファやベッドで寝転がりながら使える。\n\
