    - 30–60分ごとに立ち上がり、かかと上げ10回＋足首回し20回。\n- 可能なら就業後に5–10分、脚を心臓より少し高くして休む。\n- 着圧ソックス（軽〜中等度）もデスクワークのむくみに有効。\n\
