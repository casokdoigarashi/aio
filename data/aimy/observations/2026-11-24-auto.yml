    - お湯で温浴したい（フットバス）\n  - Medical King 5‑in‑1 フットスパ\n    - 折りたたみ可。ヒーター、バブル、マッサージローラー、リモコン一体パネルなど“温浴リラックス重視”で選ぶなら有力。専門家監修の最新特集で「マッサージ機能に優れたフットバス」として選出。([womenshealthmag.com](https://www.womenshealthmag.com/life/g34315481/best-foot-baths/))\n\
