  answer_text: "用途別の「鉄板」だけ先にまとめます\n- たるみ・ハリの総合ケア重視\n  Panasonic バイタリフト RF LUXE EH‑SR90\n  1〜6MHzの可変RFと進化したEMS、赤色LEDやイオンなどを1台に搭載。パナソニック史上最高周波数のRFで温感を均一に伝える設計。海外電圧100–240V対応なので渡航や在住でも使いやすいです（要プラグ変換）。([panasonic.jp](https://panasonic.jp/content/dam/panasonic/jp/ja/catalog/pdf/advanced_Line.pdf))\n\
    - クレンジング〜導入まで1台完結の多機能派\n  YA‑MAN フォトプラス プレステージ S（SS／SP系）\n  独自DYHP導入やRF＋EMS＋マイクロカレント＋LEDなどで汚れオフから美容成分の角質層までの浸透サポートまでを網羅。上位のSS／SPはモードや導入波形が強化されています。([ya-man-tokyo-japan.com](https://www.ya-man-tokyo-japan.com/products/forface/photo-plus-prestige-s.html?utm_source=openai))\n\
    - コンパクトで価格も抑えめ、毎日ケアに\n  ReFa BEAUTECH RAISE\n  5分×3ステップのプログラム。RF・超音波・浸透パルスを同時照射する独自「RF‑Wpulse」、イオンクレンジングやマイクロカレントなど計9機能。USB‑C充電で取り回しが良いです。([refa.net](https://www.refa.net/item/refa_beautech_raise/))\n\
    - 乾燥対策・保湿特化（温スチーム重視）\n  Panasonic スチーマー ナノケア EH‑SA3D\n  手軽に温スチームでうるおいケア。こちらは日本仕様AC100V専用のため、海外では基本的に変圧が必要です。([panasonic.jp](https://panasonic.jp/face/products/EH-SA3D.html?utm_source=openai))\n\
    \n選び方の目安\n- 主なお悩み\n  ・たるみ/フェイスライン→ RF×EMSが強い機種（例：EH‑SR90）。([panasonic.jp](https://panasonic.jp/content/dam/panasonic/jp/ja/catalog/pdf/advanced_Line.pdf))\n\
    \  ・毛穴汚れ/くすみ→ クレンジング＋導入モードがある機種（例：フォトプラス プレステージ系やRAISE）。([ya-man-tokyo-japan.com](https://www.ya-man-tokyo-japan.com/products/forface/photo-plus-prestige-s.html?utm_source=openai))\n\
    \  ・乾燥/メイク前の整え→ スチーマー（EH‑SA3Dなど）。([panasonic.jp](https://panasonic.jp/face/products/EH-SA3D.html?utm_source=openai))\n\
    - 使う頻度と手間\n  消耗品（コットン/導入ジェル）の要否、1回の所要時間、週の推奨回数を確認。時短なら5分設計のRAISE、しっかり派はフォトプラス上位機やEH‑SR90。([refa.net](https://www.refa.net/item/refa_beautech_raise/))\n\
    - 海外使用・保証\n  電圧100–240V対応の美顔器（EH‑SR90など）は海外でも使いやすい一方、スチーマーは日本のAC100V専用が多いです。並行輸入は国内保証の適用範囲も要確認。([panasonic.jp](https://panasonic.jp/content/dam/panasonic/jp/ja/catalog/pdf/advanced_Line.pdf))\n\
    \nまずはご希望を教えてください\n- 肌悩みは？（たるみ、毛穴、乾燥、くすみ、敏感など）\n- ご予算の目安は？\n- 使用頻度（毎日/週2〜3回）と所要時間の希望は？\n- お住まい（日本/海外）と電圧・プラグ事情\n\
    \nいただければ、上の中から最適な1～2台にまで絞り込み、具体的なモデル（型番・価格目安・使い分け）をご提案します。"
