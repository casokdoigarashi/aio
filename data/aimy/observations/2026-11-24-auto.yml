  answer_text: "**AiMY（エイミー）**は、健康機器や美容家電で知られる「ツカモトコーポレーション（旧ツカモトエイム）」が手掛けるウェルネスブランドです。\nインテリアに馴染むおしゃれでシンプルなデザインと、管理医療機器認証を取得した本格的な性能を両立している点が大きな特徴です。\n\
    \n用途や部位別に以下のようなマッサージャー製品がラインナップされています。\n\n---\n\n### 主な製品ラインナップ\n\n#### 1. ネックマッサージャー（首・肩用）\n* **低周波・EMSタイプ（AIM-023など）**\n\
    \  * **特徴:** 重さ約175gと非常に軽量なコードレスタイプ。首にかけて温熱ヒーターで温めながら、低周波パルスで筋肉を刺激します。\n  * **ポイント:** 付属のゲルパッドを繋げば肩周りなども同時にケア可能。「家事やデスクワークをしながら首をほぐしたい」という方に人気です。\n\
    * **もみ玉回転・ネックピロータイプ**\n  * **特徴:** ネックピローのような形状で、立体的なもみ玉と温熱ヒーターを内蔵した充電式モデル。\n  * **ポイント:** 首の付け根（後頭下筋群）を力強く揉みほぐします。首・肩だけでなく、太ももやふくらはぎ、腰など全身の気になる部位に当てて使えます。\n\
    \n#### 2. フットマッサージャー（足・ふくらはぎ用）\n* **エイミー エアーフットマッサージャー（AIM-019など）**\n  * **特徴:** 複数のエアバッグとヒーターを搭載し、足裏からふくらはぎまでをギューッと包み込むように加圧・マッサージします。\n\
    \  * **ポイント:** 本体重量が約1.5kgと非常に軽量でコンパクトなため、ソファ下などに省スペースで収納でき、移動も簡単です。\n\n#### 3. ハンドマッサージャー（手のひら・指用）\n\
    * **エイミー ハンドマッサージャー**\n  * **特徴:** 手を差し込むと内蔵エアバッグと突起が手のひらや指先を包み込み、ピンポイントで刺激します。\n  * **ポイント:** ハンドクリームを塗ってビニール手袋をしたまま使える「ハンドパック」に対応しており、指先の冷えやスマホ操作による手の疲れケアに向いています。\n\
    \n#### 4. ハンディガン（全身用）\n* **コンパクトビューティーガン（マッサージガン）**\n  * **特徴:** 片手で持てる軽量・小型の振動マシン。アタッチメントを変えることで、肩・背中・太もも・足裏など全身の筋膜リリースやコリほぐしに使えます。\n\
    \n#### 5. シート・座椅子タイプ（全身・骨盤ケア）\n* **スイッチチェア（AIM-133など）**\n  * **特徴:** リクライニング座椅子にバイブレーションやもみ玉、ヒーター機能が組み込まれたシートマッサージャー。\n\
    * **エアリーシェイプ（AIRLY SHAPE）**\n  * **特徴:** エイミーの代表的シリーズで、エアーの力で骨盤周り・お尻・腰を全方位から締め上げる骨盤ケアチェア。\n\n---\n\
    \n### エイミーのマッサージャーが選ばれる理由\n1. **本格的な医療機器認証モデルが多い**\n   * 単なるリラクゼーション雑貨ではなく、疲労回復、血行促進、神経痛・筋肉痛の緩解などを目的とした管理医療機器の認証を受けた製品が多数揃っています。\n\
    2. **軽量・コードレス・省スペース**\n   * 大型のマッサージ機と違い、使わないときはサッと片付けられるコンパクト設計です。\n3. **手が届きやすい価格設定**\n   * 多くの製品が数千円〜1万円台と、日常使いやギフトとして購入しやすい価格帯に設定されています。\n\
    \n**特定の部位（首・足・手など）でお探しのモデルや、比較したい製品があれば詳しくお調べしますのでお知らせください。**"
