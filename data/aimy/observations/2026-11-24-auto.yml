  answer_text: "**AiMY（エイミー） エアリーシェイプ**は、ツカモトコーポレーションが展開するトータルボディケアブランド「AiMY」の**骨盤・姿勢ケア専用リクライニングチェア**です。\n\
    \n2007年の初代登場以来、シリーズ累計79万台以上を売り上げているロングセラーシリーズで、一般的なマッサージチェアと違い**「エアーバッグによる骨盤まわりの引き締め・ストレッチ」**と**「インテリアに馴染むソファ型デザイン」**が大きな特徴です。\n\
    \n---\n\n### 主な特徴と機能\n\n1. **5ヶ所の立体エアーバッグで骨盤まわりを包み込む**\n   - 座面・左右（骨盤サイド）・背面・骨盤底筋まわりにエアーバッグを内蔵。\n\
    \   - 骨盤を左右からグッと押し締める、下から押し上げる、背中を伸ばすなど、立体的な動き（3Dアクション）で骨盤まわりの筋肉にアプローチします。\n\n2. **選べる充実の自動コース**\n\
    \   - **ヒップコース**：お尻まわりを引き締め・エクササイズ。\n   - **ウエストコース**：腰まわりのひねりやストレッチ。\n   - **フェムコース（骨盤底筋ケア）**：座面からのアプローチで、普段意識しにくい骨盤底筋まわりをケア。\n\
    \   - **トータルクイックコース**：短時間で全体をバランスよくほぐす時短モード。\n   - ※近年のモデル（AIM-FN058等）には、上半身を左右にひねる「ツイスト機能」なども追加されています。\n\
    \n3. **リクライニング可能でリラックスチェアにもなる**\n   - リクライニングを倒すことで、座った状態だけでなく寝転んだような姿勢で深くストレッチできます。\n   - コース作動時以外も、普通のローチェアやパーソナルソファとして日常使いできます。\n\
    \n4. **省スペース＆インテリア性の高いデザイン**\n   - 大型マッサージチェアのような圧迫感がなく、コロンとした丸みのあるフォルムとファブリック調の素材で、リビングや自室に違和感なく溶け込みます。\n\
    \n---\n\n### 代表的なモデル展開\n\n* **エアリーシェイプ（座椅子タイプ / 例：AIM-FN056、AIM-FN058 など）**\n  - 床に直置きして使うタイプ。座面が低めで、和室やローテーブルでの使用に適しています。\n\
    * **エアリーシェイプ プラス（脚付きタイプ / 例：AIM-FN057 など）**\n  - 木製などの脚部が付いた1人掛けソファタイプ。立ち座りが楽で、一般的なソファやダイニングの高さに馴染みます。\n\
    \n---\n\n### こんな方におすすめ\n\n* **産後ケアをしたい方**（出産後の骨盤の開き・ゆるみが気になる方）\n* **デスクワークで姿勢が崩れがちな方**（猫背、足を組む癖がある方）\n\
    * **ぽっこりお腹や下半身のたるみが気になる方**\n* **本格的なマッサージチェアを置くスペースがない方**\n\n---\n\n### 注意点\n\n* **揉み玉方式ではない：** ゴリゴリと揉み玉で強い指圧を受けるタイプではなく、「エアーバッグによる圧迫・ストレッチ」です。強いピンポイントの揉み心地を求める場合は体感が異なります。\n\
    * **使用時間の目安：** 骨盤まわりをしっかり加圧するため、1回15分、1日合計30分程度を目安に使用することが推奨されています。"
