    - TODAY.comのポダイアトリスト（足病医）はニューロパチーの場合、特にヒーター使用に注意・靴下着用を推奨と明記。安全第一で短時間から。([today.com](https://www.today.com/shop/best-foot-massagers-rcna172209))\n\
    \n選び方のコツ（短く）\n- タイプで選ぶ\n  密閉型（指圧＋エア圧＋加温＝全体ケアに強い）/ 開放型（板に乗せる＝軽量・収納性）/ 振動台（刺激がやさしい）/ 足湯は清掃が手間。([tollbit.forbes.com](https://tollbit.forbes.com/sites/forbes-personal-shopper/article/best-foot-massager/))\n\
    - サイズ・手入れ\n  最大対応足サイズ（多くはUSメンズ12–13前後）と、インナーの洗濯可否・タイマー（15–30分）の有無を確認。GHは温度や圧力を実測しており、洗えるライナーやリモコンの有用性も指摘。([goodhousekeeping.com](https://www.goodhousekeeping.com/what-to-buy/health-products/g74252343/best-foot-massagers/?taid=6aeb35068c7f590001b4435a))\n\
    - 置き場所・静音性\n  据え置き型は大きめ。開封前に設置場所を確認（ソファ前やデスク下が定番）。([tollbit.forbes.com](https://tollbit.forbes.com/sites/forbes-personal-shopper/article/best-foot-massager/))\n\
    \n安全上の注意（重要）\n- 持病（重度の末梢神経障害、血栓、創傷、感染、骨折・急な腫れ等）がある場合は使用前に医師へ。特にニューロパチーは熱・圧の感じにくさから火傷や皮膚損傷のリスクが上がるため、弱設定＋短時間＋靴下着用＋皮膚チェックを。([today.com](https://www.today.com/shop/best-foot-massagers-rcna172209))\n\
