  answer_text: "用途によって「良いブランド」は少し変わります。まずは下の3点を教えてください。\n- どんな目的？（就寝中のリラックス系／運動後の着圧リカバリー／むくみ対策／医療グレード）\n\
    - 使う場面と季節（寝るとき／日中に数時間／旅行時など）\n- 予算と購入エリア（日本／米国）\n\n前提のざっくり案内（失敗しにくい選び方）\n- 就寝中メインなら「非着圧・リラックス系」を。締め付けがほぼなく、肌触り重視。\n\
    - 運動後〜日常の疲労軽減やむくみ対策なら「着圧（コンプレッション）系」。ふくらはぎ周径に合わせて段階着圧・フラットシームを選ぶ。\n- 医療レベルのむくみ・静脈対策は「医療用弾性ストッキング（15–20,\
    \ 20–30mmHgなど）」。症状が強い場合は専門家に相談。\n\n目的別の定番ブランド例\n- 非着圧・睡眠リカバリー系（就寝用リラックス）\n  - VENEX（ベネクス）：日本発の“休養専用”で有名。やわらかい生地で締め付け少なめ。\n\
    \  - TENTIAL（BAKUNE）：就寝向けラインが豊富。セットアップで揃えやすい。\n  - A.A.TH（エイエイティーエイチ）：軽い着心地のリカバリー系ウェア。\n  - 備考：このカテゴリは「体感差が大きい」ので、まずは1着から試すのがおすすめ。\n\
    \n- 着圧・コンプレッション系（運動後〜日常のむくみ対策）\n  - 2XU、CEP、SKINS、CW-X（ワコール）：スポーツ由来の定番。タイツ／ソックス／スリーブが揃う。\n  - Zensah：ソックスやカーフスリーブが使いやすい（米国で入手しやすい）。\n\
    \  - ポイント：ふくらはぎ周径を測ってサイズ選び。就寝中は強い着圧は基本NG。\n\n- 遠赤外線・IR系テキスタイル（軽い着圧〜非着圧）\n  - Under Armour（UA RUSH/Recover系）、KYMIRA\
    \ など。運動後〜日常用のトップス／ボトムス。\n\n- 医療グレード（むくみ・静脈系の本格対策）\n  - Bauerfeind、medi、Sigvaris など。着圧値を見て選ぶ（米国は処方が必要な強度もあり）。\n\
    \n注意点とコツ\n- 科学的エビデンスはカテゴリで差があります。着圧は「むくみ・筋肉痛の軽減」に比較的根拠があり、睡眠系は「快適性・体感重視」と考えるとミスマッチが少ないです。\n- まずは「ソックス\
    \ or カーフスリーブ」から始めると費用対効果が高め。\n- 敏感肌なら縫い目やタグ位置、ポリウレタン比率、洗濯耐久（ネット使用推奨）を確認。\n- 交換目安：着圧は使用頻度にもよりますが3〜6カ月で張力が落ちやすいです。\n\
    \nもし「就寝用がいい」「通勤中にむくみを抑えたい」など具体的なシーンと予算（例：1万円以内／$80以内）を教えていただければ、モデル名まで絞っておすすめを出します。"
