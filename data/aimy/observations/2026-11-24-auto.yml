  answer_text: "用途と好みで“良い”ブランドは変わります。まずは下から近いものを教えてください（複数可）:\n- 睡眠・在宅のリラックス重視\n- 運動後・日中用の着圧（筋疲労・むくみ対策）\n\
    - 立ち仕事や長距離移動用の本格着圧ソックス\n- 予算の目安／購入地域（日本 or 米国）\n\n候補の目安\n- 着圧系（運動後・日中向け）\n  - 2XU、CEP、CW-X（ワコール）：スポーツ着圧で定評。サイズ表と圧力値(mmHg)の明記が親切。\n\
    \  - 医療グレード：Sigvaris、JOBST、medi（メディ）：立ち仕事・旅行のむくみに強い。就寝中の使用は基本非推奨。\n- 睡眠・ルームウェア系（ゆったり、生地に鉱物/セラミック等を練り込み）\n\
    \  - VENEX（ベネクス）、TENTIAL（BAKUNE系）、Under Armour Athlete Recovery/Celliant：就寝〜在宅の快適さ重視。強い着圧はなし。\n- 体温調整・保温寄り（回復“用途補助”）\n\
    \  - Mizuno Breath Thermo などの保温ベースレイヤー：睡眠・オフ日の快適性に寄与。\n\n選び方のコツ\n- 圧の目安：日常15–20 mmHg、運動後20–30 mmHgが一般的。初めては低めから。\n\
    - フィット最優先：足首・ふくらはぎ・太腿の周径でサイズ決定。返品交換しやすさを確認。\n- 肌が敏感なら縫い目位置・素材（ナイロン比率）に注意。強い着圧は就寝時は避ける。\n- 「回復促進」は個人差あり。痛みや強い浮腫は医療用を医師に相談。\n\
    \nご希望（用途・予算・購入地域）を教えていただければ、具体的なモデルを3–4点に絞ってご提案します。必要なら在庫や価格もこちらで確認します。"
